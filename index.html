/* ================================================================
   ERWEITERUNG v7: KI-Lead-Finder (Web-Recherche statt Scraper)
   Findet echte Betriebe per KI+Websuche und legt sie als Leads an.
   ================================================================ */
const LeadFinder={
  found:[],
  open(){
    Modal.open(`<div class="mhead"><div><div class="eyebrow">Lead-Finder · KI-Recherche</div><h2 class="display">Neue Leads finden</h2></div><button class="iconbtn" onclick="Modal.close()">✕</button></div>
    <div class="mbody">
      <div class="grid2">
        <label class="fl">Branche / Gewerk<input class="in" id="lf_trade" placeholder="z. B. Elektriker, GaLaBau, Dachdecker" value="${esc(DB.industryPack!=='none'?(INDUSTRY_PACKS[DB.industryPack].label.split(' ')[0]):'')}"></label>
        <label class="fl">Region / Stadt<input class="in" id="lf_region" placeholder="z. B. Stuttgart, Raum Ludwigsburg"></label>
        <label class="fl">Anzahl (max. 15)<input class="in" id="lf_count" type="number" value="8" min="1" max="15"></label>
        <label class="fl">Zusatzkriterium (optional)<input class="in" id="lf_extra" placeholder="z. B. 10–50 Mitarbeiter, keine moderne Website"></label>
      </div>
      <button class="btn gold" id="lf_btn" style="margin-top:14px" onclick="LeadFinder.search()">🔍 Recherche starten</button>
      <div class="hint" id="lf_status" style="margin-top:10px">Die KI durchsucht öffentliche Quellen (Firmenwebsites, Branchenverzeichnisse) und trägt echte Betriebe mit Kontaktdaten zusammen. Keine erfundenen Firmen – Felder, die nicht sicher belegbar sind, bleiben leer.</div>
      <div id="lf_results" style="margin-top:14px"></div>
    </div>
    <div class="mfoot"><span class="hint" id="lf_sum"></span><button class="btn gold" id="lf_import" style="display:none" onclick="LeadFinder.importSel()">Ausgewählte übernehmen</button></div>`,'xl');
  },
  async search(){
    const trade=$('#lf_trade').value.trim(), region=$('#lf_region').value.trim();
    if(!trade||!region){toast('Branche und Region angeben','err');return}
    if(!CLOUD.on()&&!DB.settingsAI.apiKey){$('#lf_status').innerHTML='KI nicht konfiguriert → Einstellungen → KI.';return}
    const n=Math.min(15,Math.max(1,+$('#lf_count').value||8)), extra=$('#lf_extra').value.trim();
    const btn=$('#lf_btn'); btn.disabled=true; $('#lf_status').innerHTML='<span class="pulse"></span> &nbsp;Recherchiere echte '+esc(trade)+'-Betriebe in '+esc(region)+'…';
    try{
      const prompt=`Finde ${n} echte, existierende ${trade}-Betriebe in/um ${region}${extra?' ('+extra+')':''}. Nutze Websuche für reale Firmen. 
Antworte NUR mit JSON-Array, kein Markdown:
[{"company":"","contactLast":"","email":"","phone":"","city":"PLZ Ort","website":"","note":"1 Satz warum passender Lead (Größe/Website-Zustand/Auffälligkeit)"}]
Strenge Regeln: Nur real belegbare Betriebe. Keine erfundenen Namen/Nummern/Mails. Unsichere Felder leer lassen. Lieber weniger echte als erfundene Einträge.`;
      const payload={model:'claude-sonnet-4-6',max_tokens:1400,tools:[{type:'web_search_20250305',name:'web_search'}],messages:[{role:'user',content:prompt}]};
      let res;
      if(CLOUD.on()){ const {data:{session}}=await CLOUD.sb.auth.getSession();
        res=await fetch(CLOUD.url+'/functions/v1/ai-proxy',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify(payload)});
      }else{ res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':DB.settingsAI.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(payload)}); }
      const data=await res.json(); if(data.error)throw new Error(data.error.message);
      const txt=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
      const m=txt.match(/\[[\s\S]*\]/); if(!m)throw new Error('Keine strukturierte Antwort');
      let arr=JSON.parse(m[0]);
      /* Dubletten gegen bestehende Kunden filtern */
      const exC=new Set(DB.customers.map(c=>c.company.toLowerCase().trim()));
      const exE=new Set(DB.customers.map(c=>(c.email||'').toLowerCase()).filter(Boolean));
      arr=arr.filter(x=>x.company&&!exC.has(x.company.toLowerCase().trim())&&!(x.email&&exE.has(x.email.toLowerCase())));
      this.found=arr.map((x,i)=>({...x,_i:i,_sel:true,trade}));
      if(!this.found.length){$('#lf_status').textContent='Keine neuen Betriebe gefunden (evtl. alle schon im CRM). Andere Region/Kriterien versuchen.';btn.disabled=false;return}
      $('#lf_status').textContent='';
      $('#lf_results').innerHTML=this.found.map(x=>`<div style="display:flex;gap:10px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--line)">
        <input type="checkbox" checked onchange="LeadFinder.found[${x._i}]._sel=this.checked;LeadFinder.sum()" style="margin-top:3px">
        <div style="flex:1"><div style="color:var(--ivory);font-weight:600">${esc(x.company)}</div>
          <div style="font-size:12px;color:var(--muted)">${esc([x.contactLast,x.city,x.phone,x.email].filter(Boolean).join(' · ')||'—')}</div>
          ${x.website?`<div style="font-size:11px"><a href="${esc(x.website)}" target="_blank" rel="noopener">${esc(x.website)}</a></div>`:''}
          ${x.note?`<div style="font-size:11.5px;color:var(--gold-bright);margin-top:3px">${esc(x.note)}</div>`:''}</div></div>`).join('');
      $('#lf_import').style.display=''; this.sum();
      $('#lf_status').innerHTML='<span style="color:var(--gold)">'+this.found.length+' Betriebe gefunden.</span> Prüfen, abwählen was nicht passt, dann übernehmen. Tipp: Angaben vor dem Anruf kurz gegenchecken.';
    }catch(e){ $('#lf_status').textContent='Recherche fehlgeschlagen: '+e.message; }
    btn.disabled=false;
  },
  sum(){ const n=this.found.filter(x=>x._sel).length; const el=$('#lf_sum'); if(el)el.textContent=n+' ausgewählt'; },
  importSel(){
    const sel=this.found.filter(x=>x._sel); if(!sel.length){toast('Nichts ausgewählt','err');return}
    const items=sel.map(x=>({id:uid(),company:x.company,contactLast:x.contactLast||'',salutation:'Herr',email:x.email||'',phone:x.phone||'',city:x.city||'',website:x.website||'',industry:x.trade||'',notes:(x.note?'[KI-Lead-Finder] '+x.note:'[KI-Lead-Finder]'),stage:'Neu',dealValue:0,ownerId:Auth.user.id,created:new Date().toISOString(),updated:new Date().toISOString(),history:[]}));
    commit('KI-Lead-Finder: '+items.length+' Leads übernommen',()=>{DB.customers.push(...items)},'crm');
    Modal.close(); Router.go('customers'); toast(items.length+' Leads übernommen – im Power-Dialer sofort abtelefonierbar');
  }
};

/* ---------- White-Label-Generator: erzeugt fertige Kunden-index.html ---------- */
const WhiteLabel={
  async provision(){
    if(!CLOUD.on()){toast('Nur im Cloud-Modus möglich','err');return}
    const email=$('#wl_cust_mail').value.trim(), name=$('#wl_cust_name').value.trim();
    if(!email){toast('E-Mail des Kunden angeben','err');return}
    const st=$('#wl_prov_status'); st.innerHTML='<span class="pulse"></span> Lege Kunden-Zugang an…';
    try{
      const {data,error}=await CLOUD.sb.rpc('provision_customer',{p_email:email,p_name:name||email});
      if(error)throw new Error(error.message);
      st.innerHTML='<span style="color:var(--gold)">✓ Zugang für '+esc(email)+' angelegt.</span> Der Kunde meldet sich jetzt auf seiner eigenen URL mit dieser E-Mail an und landet in seinem leeren System.';
      commit('White-Label: Kunden-Zugang angelegt für '+email,()=>{},'settings');
    }catch(e){ st.textContent='Fehler: '+e.message+' (Ist das SQL-Update v2 eingespielt?)'; }
  },
  async generate(){
    const name=$('#wl_name').value.trim(); if(!name){toast('Firmenname fehlt','err');return}
    const tag=$('#wl_tag').value.trim(), accent=$('#wl_accent').value, pack=$('#wl_pack').value;
    const feats={}; document.querySelectorAll('[data-wf]').forEach(el=>feats[el.dataset.wf]=el.checked);
    const st=$('#wl_status'); st.innerHTML='<span class="pulse"></span> Baue Kundensystem…';
    let logo='';
    const f=$('#wl_logo').files[0];
    if(f){ logo=await new Promise(r=>{const rd=new FileReader();rd.onload=()=>r(rd.result);rd.readAsDataURL(f);}); }
    try{
      /* aktuelles laufendes Dokument als Vorlage holen */
      const res=await fetch(location.href); let html=await res.text();
      /* BRAND-Block ersetzen */
      const brandBlock=`const BRAND={
  name:   ${JSON.stringify(name)},
  tagline:${JSON.stringify(tag)},
  accent: ${JSON.stringify(accent)},
  logoUrl:${JSON.stringify(logo||'')}
};`;
      html=html.replace(/const BRAND=\{[\s\S]*?\};/, brandBlock);
      /* Default-Features + Branchenpaket im defaultDB voreinstellen, damit Kunde ab Login passend startet */
      const featStr=Object.entries(feats).map(([k,v])=>k+':'+(v?'true':'false')).join(',');
      html=html.replace(/features:\{crm:true[^}]*\}/, 'features:{'+featStr+'}');
      /* Branchen-Paket als Startwert (migrateV3 setzt nur wenn undefined → wir setzen in defaultDB) */
      html=html.replace(/(settingsAI:\{apiKey:'',model:'[^']*'\},)/, "$1\n    industryPack:"+JSON.stringify(pack)+",");
      const blob=new Blob([html],{type:'text/html'});
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='index.html'; a.click();
      st.innerHTML='<span style="color:var(--gold)">✓ '+esc(name)+'-System erzeugt.</span> Datei heruntergeladen → bei Vercel als neues Projekt hochladen (siehe Schritte unten).';
      commit('White-Label-System erstellt für „'+name+'“',()=>{},'settings');
    }catch(e){ st.textContent='Fehler: '+e.message+' – bitte erneut versuchen.'; }
  }
};

  chip(t2){ const el=$('#est_desc'); if(el){ el.value=(el.value?el.value+', ':'')+t2; el.focus(); } },
  close(){ const ov=$('#eststudio'); if(ov)ov.remove(); Catalog.done(); },
  reset(){ const ov=$('#eststudio'); if(ov)ov.remove(); this.open(); },
  async run(){
    const desc=($('#est_desc').value||'').trim();
    if(!desc){toast(t('Bitte das Projekt beschreiben','Descrivi il progetto'),'err');return}
    if(!CLOUD.on()&&!DB.settingsAI.apiKey){toast('KI nicht konfiguriert → Einstellungen → KI','err');return}
    this.found=[]; this.queue=[]; this._idx=0; this._draining=false; this._done=false; this._lastText='';
    const btn=$('#est_btn'); if(btn)btn.disabled=true;
    $('#est_live').innerHTML=`<div class="eyebrow" style="margin-bottom:8px">${t('Positionen','Voci')}</div><div id="est_rows"></div><div class="hint" id="est_status" style="margin-top:10px"><span class="es-tick"><span class="pulse"></span> <span id="est_tick">${t('Ich lese dein Projekt…','Leggo il progetto…')}</span></span></div>`;
    this._startTicker();
    const cat=(DB.catalog||[]);
    const priceList = cat.length ? cat.map(c=>`${c.name} | ${c.unit} | ${c.price}`).join('\n') : '(keine Preisliste)';
    const prompt=`Du bist ein blitzschneller Kalkulations-Assistent für Handwerks-/Dienstleistungsangebote.
PREISLISTE (Name | Einheit | Preis netto):
${priceList}
PROJEKT: "${desc}"
Gib die Angebotspositionen als JSONL aus: EINE Position pro Zeile als kompaktes JSON-Objekt, KEINE Umschließung, KEIN Fließtext, KEIN Markdown.
Format je Zeile: {"desc":"","qty":1,"unit":"Pauschal","price":0,"estimated":false}
Regeln: passende Preislisten-Position exakt übernehmen (estimated=false). Fehlendes konservativ schätzen (estimated=true). Einheit nur aus: Pauschal,Stück,Std.,Tag,Monat,km. Keine erfundenen Marken. 4-10 saubere Positionen.${aiLang()}`;
    try{
      const payload={model:'claude-haiku-4-5',max_tokens:900,stream:true,messages:[{role:'user',content:prompt}]};
      let res;
      if(CLOUD.on()){ const {data:{session}}=await CLOUD.sb.auth.getSession();
        res=await fetch(CLOUD.url+'/functions/v1/ai-proxy',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify(payload)});
      }else{
        res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':DB.settingsAI.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(payload)});
      }
      if(!res.ok){ let msg='Fehler '+res.status; try{const j=await res.json(); msg=j.error?.message||msg;}catch(e){} throw new Error(msg); }
      const reader=res.body&&res.body.getReader?res.body.getReader():null;
      if(reader){ const dec=new TextDecoder(); let raw='';
        while(true){ const {done,value}=await reader.read(); if(done)break; raw+=dec.decode(value,{stream:true}); this._process(raw,false); }
        this._process(raw,true);
      } else { const data=await res.json(); this._lastText=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join(''); this._process('',true,this._lastText); }
      this._done=true; if(!this._draining) this._afterDrain();
    }catch(e){ this._stopTicker(); const st=$('#est_status'); if(st)st.textContent=t('Schätzung fehlgeschlagen: ','Stima non riuscita: ')+e.message; if(btn)btn.disabled=false; }
  },
  _process(raw,end,forceText){
    let text=forceText;
    if(text===undefined){
      if(raw.includes('content_block_delta')||/(^|\n)data:/.test(raw)){
        text=''; raw.split('\n').forEach(line=>{ line=line.trim(); if(line.startsWith('data:')){ const p=line.slice(5).trim(); if(p&&p!=='[DONE]'){ try{const j=JSON.parse(p); if(j.type==='content_block_delta'&&j.delta&&typeof j.delta.text==='string')text+=j.delta.text; }catch(e){} } } });
      } else { try{ const j=JSON.parse(raw); text=(j.content||[]).filter(b=>b.type==='text').map(b=>b.text).join(''); }catch(e){ if(!end)return; text=this._lastText; } }
    }
    this._lastText=text||'';
    const lines=this._lastText.split('\n');
    const upto=end?lines.length:lines.length-1;
    for(let i=this._idx;i<upto;i++){ this._idx=i+1;
      let ln=(lines[i]||'').trim().replace(/^```(json)?/i,'').replace(/```$/,'').trim();
      if(!ln||ln[0]!=='{')continue;
      let obj; try{obj=JSON.parse(ln)}catch(e){continue}
      if(obj&&obj.desc){ this.queue.push(obj); this._startDrain(); }
    }
  },
  _startDrain(){ if(this._draining)return; this._draining=true; this._drainNext(); },
  _drainNext(){ if(!this.queue.length){ this._draining=false; if(this._done)this._afterDrain(); return; }
    const obj=this.queue.shift(); this._addRow(obj); setTimeout(()=>this._drainNext(),140); },
  _addRow(p){
    const UNITS=['Pauschal','Stück','Std.','Tag','Monat','km'];
    const item={_i:this.found.length,_incl:true,desc:String(p.desc||'').slice(0,160),qty:Math.max(0,Number(p.qty)||1),unit:UNITS.includes(p.unit)?p.unit:(p.unit==='Stueck'?'Stück':'Pauschal'),price:Math.round((Number(p.price)||0)*100)/100,estimated:!!p.estimated,note:String(p.note||'').slice(0,200)};
    this.found.push(item);
    const rows=$('#est_rows'); if(!rows)return;
    const div=document.createElement('div'); div.className='estrow'; const i=item._i;
    div.innerHTML=`<input type="checkbox" checked onchange="Estimator.found[${i}]._incl=this.checked;Estimator.sum()">
      <input class="in" style="flex:1;min-width:120px" value="${esc(item.desc)}" oninput="Estimator.found[${i}].desc=this.value">
      <input class="in" type="number" step="0.5" style="width:64px" value="${item.qty}" oninput="Estimator.found[${i}].qty=Math.max(0,Number(this.value)||0);Estimator.sum()">
      <span class="hint" style="width:52px;text-align:center">${esc(item.unit)}</span>
      <input class="in" type="number" step="0.01" style="width:96px" value="${item.price}" oninput="Estimator.found[${i}].price=Math.round((Number(this.value)||0)*100)/100;Estimator.sum()">
      <span class="badge ${item.estimated?'b-warn':'b-green'}" style="font-size:9px" title="${esc(item.note||'')}">${item.estimated?t('geschätzt','stimato'):'Katalog'}</span>`;
    rows.appendChild(div);
    const tick=$('#est_tick'); if(tick)tick.textContent=t('Stelle Position zusammen: ','Aggiungo voce: ')+item.desc.slice(0,40)+'…';
    this.sum(); const b=$('#est_body'); if(b)b.scrollTop=b.scrollHeight;
  },
  _afterDrain(){
    this._stopTicker();
    const btn=$('#est_btn'); if(btn){btn.disabled=false;}
    const st=$('#est_status');
    if(!this.found.length){ if(st)st.textContent=t('Keine Positionen erzeugt – Beschreibung konkreter fassen.','Nessuna voce generata – descrivi in modo più concreto.'); return; }
    if(st)st.innerHTML=`<span style="color:var(--gold)">✓ ${this.found.length} ${t('Positionen erstellt.','voci create.')}</span> ${t('Unverbindliche Erstschätzung – bitte prüfen.','Stima iniziale non vincolante – da verificare.')}`;
    const ap=$('#est_apply'), rs=$('#est_reset'); if(ap)ap.style.display=''; if(rs)rs.style.display='';
    const eb=$('#est_btn'); if(eb)eb.style.display='none';
  },
  _startTicker(){ const msgs=LANG==='it'?['Leggo il progetto…','Confronto con il listino…','Calcolo le voci…','Arrotondo e verifico…']:['Ich lese dein Projekt…','Gleiche mit eurer Preisliste ab…','Kalkuliere Positionen…','Runde und prüfe…']; let i=0; this._stopTicker(); this._tickIv=setInterval(()=>{ const el=$('#est_tick'); if(el&&!this.found.length){ el.textContent=msgs[i%msgs.length]; i++; } },1100); },
  _stopTicker(){ if(this._tickIv){clearInterval(this._tickIv);this._tickIv=null;} },
  sum(){
    const inc=this.found.filter(p=>p._incl);
    const net=inc.reduce((s,p)=>s+p.qty*p.price,0);
    const estNet=inc.filter(p=>p.estimated).reduce((s,p)=>s+p.qty*p.price,0);
    const low=Math.round(net-estNet*0.15), high=Math.round(net+estNet*0.20);
    const el=$('#est_total'); if(el)el.innerHTML=`${inc.length} ${t('Pos.','voci')} · ${t('Netto','Imponibile')} <span class="es-total">${eur(net)}</span> <span style="color:var(--faint)">· ${t('Spanne','Fascia')} ${eur(low)}–${eur(high)}</span>`;
  },
  apply(){
    const inc=this.found.filter(p=>p._incl); if(!inc.length){toast(t('Nichts ausgewählt','Nulla selezionato'),'err');return}
    const mapped=inc.map(p=>({desc:p.desc,qty:p.qty,unit:p.unit,discount:0,price:p.price}));
    const empty=Docs.items.length===1&&!Docs.items[0].desc&&!Number(Docs.items[0].price);
    Docs.items = empty ? mapped : Docs.items.concat(mapped);
    const ov=$('#eststudio'); if(ov)ov.remove();
    Catalog.done();
  }
};

const EXP_CATS=['Wareneinkauf / Material','Werkzeug & Geräte','Fahrzeug / Kfz','Kraftstoff','Miete & Nebenkosten','Versicherungen & Beiträge','Telefon & Internet','Büromaterial','Fortbildung','Fremdleistungen / Subunternehmer','Werbung & Marketing','Bewirtung','Gebühren / Bank','Leasing','Sonstiges'];
const r2=x=>Math.round((Number(x)||0)*100)/100;

VIEWS.push({id:'accounting',icon:'🧾',label:'Buchhaltung',sec:'Buchhaltung',feature:'accounting'});

const Acct={
  tab:'overview',
  _period(){ return this._p || {mode:'quarter', year:new Date().getFullYear(), q:Math.floor(new Date().getMonth()/3)+1, m:new Date().getMonth()+1}; },
  render(root){
    const T=[['overview','Übersicht'],['expenses','Belege & Ausgaben'],['ustva','USt-Voranmeldung'],['euer','EÜR & Export'],['coach','KI-Steuer-Coach']];

      <div class="tabs">${T.map(([id,l])=>`<div class="tab ${this.tab===id?'active':''}" onclick="Acct.tab='${id}';Acct.render(document.querySelector('#viewroot'))">${l}</div>`).join('')}</div>
      <div id="acct_body" style="margin-top:16px"></div>`;
    this['t_'+this.tab]($('#acct_body'));
  },
  /* ---- Periodenfilter ---- */
  periodBar(){
    const p=this._period();
    const yrs=[]; const cy=new Date().getFullYear(); for(let y=cy;y>=cy-4;y--)yrs.push(y);
    return `<div class="tbar" style="margin-bottom:14px">
      <select class="in" style="width:auto" onchange="Acct._setp('mode',this.value)"><option value="year"${p.mode==='year'?' selected':''}>Ganzes Jahr</option><option value="quarter"${p.mode==='quarter'?' selected':''}>Quartal</option><option value="month"${p.mode==='month'?' selected':''}>Monat</option></select>
      <select class="in" style="width:auto" onchange="Acct._setp('year',+this.value)">${yrs.map(y=>`<option${p.year===y?' selected':''}>${y}</option>`).join('')}</select>
      ${p.mode==='quarter'?`<select class="in" style="width:auto" onchange="Acct._setp('q',+this.value)">${[1,2,3,4].map(q=>`<option value="${q}"${p.q===q?' selected':''}>Q${q}</option>`).join('')}</select>`:''}
      ${p.mode==='month'?`<select class="in" style="width:auto" onchange="Acct._setp('m',+this.value)">${Array.from({length:12},(_,i)=>i+1).map(m=>`<option value="${m}"${p.m===m?' selected':''}>${['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'][m-1]}</option>`).join('')}</select>`:''}
    </div>`;
  },
  _setp(k,v){ const p=this._period(); p[k]=v; this._p=p; this.render($('#viewroot')); },
  _inPeriod(dateStr){ if(!dateStr)return false; const d=new Date(dateStr); if(isNaN(d))return false; const p=this._period();
    if(d.getFullYear()!==p.year)return false;
    if(p.mode==='year')return true;
    if(p.mode==='month')return d.getMonth()+1===p.m;
    const q=Math.floor(d.getMonth()/3)+1; return q===p.q; },
  _periodLabel(){ const p=this._period(); return p.mode==='year'?`${p.year}`:p.mode==='quarter'?`Q${p.q}/${p.year}`:`${['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'][p.m-1]} ${p.year}`; },

  /* ---- Kennzahlen der Periode ---- */
  figures(){
    const small=DB.company.smallBusiness;
    const soll=(DB.accounting?.taxMode||'ist')==='soll';
    // Einnahmen: Ist = bezahlte Rechnungen nach Zahldatum; Soll = alle Rechnungen nach Rechnungsdatum
    const incInv=DB.invoices.filter(i=>i.status!=='Storniert' && (soll ? this._inPeriod(i.date) : (i.status==='Bezahlt'&&this._inPeriod(i.paidDate||i.date))));
    let net19=0,net7=0,ustOut=0,einnahmenNetto=0,einnahmenBrutto=0;
    incInv.forEach(i=>{ einnahmenNetto+=i.net; einnahmenBrutto+=i.gross;
      if(!small){ if((i.taxRate||19)>=19){net19+=i.net;} else {net7+=i.net;} ustOut+=i.tax; } });
    // Ausgaben nach Belegdatum
    const exp=(DB.expenses||[]).filter(e=>this._inPeriod(e.date));
    let ausgabenNetto=0,ausgabenBrutto=0,vorsteuer=0;
    exp.forEach(e=>{ ausgabenNetto+=e.net; ausgabenBrutto+=e.gross; vorsteuer+=r2(e.gross-e.net); });
    const gewinn = small ? r2(einnahmenBrutto-ausgabenBrutto) : r2(einnahmenNetto-ausgabenNetto);
    const zahllast = small ? 0 : r2(ustOut - vorsteuer);
    const reservePct = DB.accounting?.reservePct ?? 30;
    const steuerReserve = r2(Math.max(0,gewinn)*reservePct/100 + Math.max(0,zahllast));
    const offen = DB.invoices.filter(i=>i.status!=='Bezahlt'&&i.status!=='Storniert').reduce((s,i)=>s+i.gross,0);
    return {small,soll,net19:r2(net19),net7:r2(net7),ustOut:r2(ustOut),einnahmenNetto:r2(einnahmenNetto),einnahmenBrutto:r2(einnahmenBrutto),ausgabenNetto:r2(ausgabenNetto),ausgabenBrutto:r2(ausgabenBrutto),vorsteuer:r2(vorsteuer),gewinn,zahllast,steuerReserve,offen:r2(offen),reservePct,expCount:exp.length,invCount:incInv.length};
  },

  /* ---- Übersicht ---- */
  t_overview(el){
    const f=this.figures();
    el.innerHTML=this.periodBar()+`
    <div class="grid g4" style="margin-bottom:16px">
      <div class="card kpi"><div class="lab">Einnahmen (${f.small?'brutto':'netto'})</div><div class="val gold">${eur(f.small?f.einnahmenBrutto:f.einnahmenNetto)}</div><div class="sub">${f.invCount} Rechnungen · ${f.soll?'Soll':'Ist'}</div></div>
      <div class="card kpi"><div class="lab">Ausgaben (${f.small?'brutto':'netto'})</div><div class="val">${eur(f.small?f.ausgabenBrutto:f.ausgabenNetto)}</div><div class="sub">${f.expCount} Belege</div></div>
      <div class="card kpi"><div class="lab">Gewinn (EÜR)</div><div class="val ${f.gewinn>=0?'gold':''}" style="${f.gewinn<0?'color:var(--danger)':''}">${eur(f.gewinn)}</div><div class="sub">${this._periodLabel()}</div></div>
      <div class="card kpi"><div class="lab">${f.small?'Kleinunternehmer §19':'USt-Zahllast'}</div><div class="val">${f.small?'—':eur(f.zahllast)}</div><div class="sub">${f.small?'keine USt':'USt '+eur(f.ustOut)+' − VSt '+eur(f.vorsteuer)}</div></div>
    </div>
    <div class="grid g2">
      <div class="card" style="border-color:var(--gold)"><div class="eyebrow" style="color:var(--gold);margin-bottom:8px">💰 Für Steuern zurücklegen</div>
        <div style="font-size:30px;font-family:var(--f-cond);color:var(--gold-bright)">${eur(f.steuerReserve)}</div>
        <div class="hint" style="margin-top:6px">Grobe Reserve für ${this._periodLabel()}: ${f.small?'':eur(f.zahllast)+' USt-Zahllast + '}${f.reservePct}% vom Gewinn (Einkommensteuer-Puffer). Richtwert – kein Ersatz für den Steuerberater.</div>
        <div style="margin-top:10px;display:flex;align-items:center;gap:8px"><span class="hint">Reserve-Satz:</span><input class="in" type="number" style="width:80px" value="${f.reservePct}" onchange="commit('Steuer-Reserve-Satz: '+this.value+'%',()=>{DB.accounting.reservePct=Math.max(0,Math.min(60,+this.value||30))},'settings');Acct.render(document.querySelector('#viewroot'))"><span class="hint">%</span></div>
      </div>
      <div class="card"><div class="eyebrow" style="margin-bottom:8px">Offene Forderungen</div>
        <div style="font-size:30px;font-family:var(--f-cond)">${eur(f.offen)}</div>
        <div class="hint" style="margin-top:6px">Summe unbezahlter Rechnungen (alle Perioden). Schnell nachfassen sichert Liquidität.</div>
        <button class="btn sm" style="margin-top:10px" onclick="Router.go('invoices')">Zu den Rechnungen</button>
      </div>
    </div>
    <div class="hint" style="margin-top:16px">Versteuerung: <b>${f.soll?'Soll (nach Rechnungsdatum)':'Ist (nach Zahlungseingang)'}</b> · umstellbar unter „USt-Voranmeldung". Beträge in Cent gerundet.</div>`;
  },

  /* ---- Belege & Ausgaben ---- */
  t_expenses(el){
    const exp=(DB.expenses||[]).filter(e=>this._inPeriod(e.date)).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    el.innerHTML=this.periodBar()+`
    <div class="tblwrap"><div class="tbar">
      <span class="eyebrow">Belege ${this._periodLabel()} · ${exp.length}</span>
      <button class="btn sm gold" style="margin-left:auto" onclick="Acct.addExpense()">+ Beleg erfassen</button>
      <button class="btn sm" onclick="Acct.exportExpenses()">⇩ Export</button>
    </div>
    <table><thead><tr><th>Datum</th><th>Lieferant</th><th>Kategorie</th><th style="text-align:right">Netto</th><th style="text-align:right">USt</th><th style="text-align:right">Brutto</th><th>Beleg</th><th></th></tr></thead><tbody>
    ${exp.map(e=>`<tr style="cursor:default"><td>${dfmt(e.date)}</td><td style="color:var(--ivory)">${esc(e.supplier||'—')}</td><td><span class="badge b-grey" style="font-size:9px">${esc(e.category||'—')}</span></td>
      <td style="text-align:right" class="mono">${eur(e.net)}</td><td style="text-align:right" class="mono">${e.vatRate||0}%</td><td style="text-align:right" class="mono">${eur(e.gross)}</td>
      <td>${e.hasReceipt?`<a onclick="Acct.viewReceipt('${e.id}')">📎 ansehen</a>`:'—'}</td>
      <td style="text-align:right"><button class="iconbtn" onclick="Acct.editExpense('${e.id}')">✎</button><button class="iconbtn" onclick="Acct.delExpense('${e.id}')">✕</button></td></tr>`).join('')
      ||'<tr><td colspan="8"><div class="empty">Keine Belege in dieser Periode. Erfasse den ersten – die KI hilft beim Kategorisieren.</div></td></tr>'}</tbody></table></div>`;
  },
  addExpense(){ this.editExpense(''); },
  editExpense(id){
    const e=id?(DB.expenses||[]).find(x=>x.id===id):null;
    Modal.open(`<div class="mhead"><h2 class="display">${e?'Beleg bearbeiten':'Beleg erfassen'}</h2><button class="iconbtn" onclick="Modal.close()">✕</button></div>
    <div class="mbody">
      <div class="frow"><div class="field"><label>Datum</label><input class="in" id="e_date" type="date" value="${e?.date||today()}"></div>
      <div class="field"><label>Lieferant / Händler</label><input class="in" id="e_supplier" value="${esc(e?.supplier||'')}" placeholder="z. B. Bauhaus"></div></div>
      <div class="field"><label>Beschreibung (für KI-Kategorisierung)</label><div style="display:flex;gap:8px"><input class="in" id="e_desc" value="${esc(e?.note||'')}" placeholder="z. B. Kabeltrommel und Klemmen"><button class="btn sm gold" onclick="Acct.aiCategorize()">🤖 KI</button></div></div>
      <div class="frow3"><div class="field"><label>Kategorie</label><select class="in" id="e_cat">${EXP_CATS.map(c=>`<option${e?.category===c?' selected':''}>${c}</option>`).join('')}</select></div>
      <div class="field"><label>USt-Satz</label><select class="in" id="e_vat" onchange="Acct._recalc()">${[19,7,0].map(v=>`<option value="${v}"${(e?.vatRate??19)===v?' selected':''}>${v}%</option>`).join('')}</select></div>
      <div class="field"><label>Betrag</label><select class="in" id="e_mode" onchange="Acct._recalc()"><option value="gross"${(e?._mode!=='net')?' selected':''}>Brutto</option><option value="net"${e?._mode==='net'?' selected':''}>Netto</option></select></div></div>
      <div class="frow3"><div class="field"><label>Eingegebener Betrag (€)</label><input class="in" id="e_amount" type="number" step="0.01" value="${e?(e._mode==='net'?e.net:e.gross):''}" oninput="Acct._recalc()"></div>
      <div class="field"><label>Netto</label><input class="in" id="e_net" type="number" step="0.01" value="${e?.net||''}" readonly></div>
      <div class="field"><label>Brutto</label><input class="in" id="e_gross" type="number" step="0.01" value="${e?.gross||''}" readonly></div></div>
      <div class="field"><label>Beleg-Foto / PDF (optional, lokal archiviert)</label><input class="in" type="file" accept="image/*,.pdf" id="e_receipt">${e?.hasReceipt?'<div class="hint">Beleg vorhanden – neue Datei ersetzt ihn.</div>':''}</div>
    </div>
    <div class="mfoot"><span class="hint" id="e_status"></span><button class="btn gold" onclick="Acct.saveExpense('${e?.id||''}')">Speichern</button></div>`,'wide');
    this._recalc();
  },
  _recalc(){ const amt=+($('#e_amount')?.value||0), vat=+($('#e_vat')?.value||0), mode=$('#e_mode')?.value||'gross';
    let net,gross; if(mode==='net'){ net=r2(amt); gross=r2(amt*(1+vat/100)); } else { gross=r2(amt); net=r2(amt/(1+vat/100)); }
    if($('#e_net'))$('#e_net').value=net.toFixed(2); if($('#e_gross'))$('#e_gross').value=gross.toFixed(2); },
  async aiCategorize(){
    const desc=($('#e_desc').value||'').trim(); if(!desc){toast('Kurze Beschreibung eingeben','err');return}
    if(!CLOUD.on()&&!DB.settingsAI.apiKey){toast('KI nicht konfiguriert (Einstellungen → KI)','err');return}
    const st=$('#e_status'); st.textContent='KI kategorisiert…';
    const prompt=`Ordne diese Handwerker-Betriebsausgabe zu. Kategorien: ${EXP_CATS.join(', ')}.
Ausgabe: "${desc}".
Antworte NUR als JSON: {"kategorie":"<eine der Kategorien>","ust":19|7|0,"begruendung":"kurz"}. USt in DE meist 19%, Lebensmittel/Bewirtung teils 7%, Versicherungen/Gebühren oft 0%.`;
    try{
      const payload={model:'claude-sonnet-4-6',max_tokens:300,messages:[{role:'user',content:prompt}]};
      let res; if(CLOUD.on()){ const {data:{session}}=await CLOUD.sb.auth.getSession();
        res=await fetch(CLOUD.url+'/functions/v1/ai-proxy',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify(payload)});
      }else{ res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':DB.settingsAI.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(payload)}); }
      const data=await res.json(); if(data.error)throw new Error(data.error.message);
      const txt=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join(''); const m=txt.match(/\{[\s\S]*\}/); if(!m)throw new Error('keine Antwort');
      const j=JSON.parse(m[0]);
      if(j.kategorie&&EXP_CATS.includes(j.kategorie))$('#e_cat').value=j.kategorie;
      if([19,7,0].includes(j.ust)){$('#e_vat').value=j.ust; this._recalc();}
      st.textContent='Vorschlag übernommen: '+(j.begruendung||'');
    }catch(err){ st.textContent='KI-Fehler: '+err.message; }
  },
  async saveExpense(id){
    const amt=+($('#e_amount').value||0); if(!amt){toast('Betrag fehlt','err');return}
    const vat=+$('#e_vat').value, mode=$('#e_mode').value;
    const net=+$('#e_net').value, gross=+$('#e_gross').value;
    const rec=$('#e_receipt').files[0];
    const data={date:$('#e_date').value||today(),supplier:$('#e_supplier').value.trim(),category:$('#e_cat').value,note:$('#e_desc').value.trim(),vatRate:vat,net:r2(net),gross:r2(gross),_mode:mode,updated:new Date().toISOString()};
    let eid=id;
    if(id){ commit('Beleg bearbeitet: '+(data.supplier||data.category),()=>Object.assign(DB.expenses.find(x=>x.id===id),data),'accounting',id); }
    else { eid='exp_'+uid(); commit('Beleg erfasst: '+(data.supplier||data.category)+' '+eur(data.gross),()=>{DB.expenses.push(Object.assign({id:eid,created:new Date().toISOString()},data))},'accounting',eid); }
    if(rec){ try{ await IDB.put('receipt:'+eid,rec); const e=DB.expenses.find(x=>x.id===eid); if(e){e.hasReceipt=true; Store.save();} }catch(err){ toast('Beleg-Datei konnte nicht gespeichert werden','err'); } }
    Modal.close(); this.render($('#viewroot')); toast('Beleg gespeichert');
  },
  async viewReceipt(id){ try{ const f=await IDB.get('receipt:'+id); if(!f){toast('Kein Beleg gespeichert','err');return} const url=URL.createObjectURL(f); window.open(url,'_blank'); }catch(e){toast('Beleg nicht abrufbar','err')} },
  delExpense(id){ const e=DB.expenses.find(x=>x.id===id); if(!confirm('Beleg „'+(e.supplier||e.category)+'" löschen?'))return;
    commit('Beleg gelöscht',()=>{DB.expenses=DB.expenses.filter(x=>x.id!==id)},'accounting',id); IDB.del&&IDB.del('receipt:'+id); this.render($('#viewroot')); },
  exportExpenses(){ const q=v=>{v=String(v??'');return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
    let csv='\uFEFFDatum;Lieferant;Kategorie;Netto;USt-Satz;USt-Betrag;Brutto;Notiz\n';
    (DB.expenses||[]).filter(e=>this._inPeriod(e.date)).sort((a,b)=>(a.date||'').localeCompare(b.date||'')).forEach(e=>{
      csv+=[q(dfmt(e.date)),q(e.supplier),q(e.category),q(e.net.toFixed(2).replace('.',',')),e.vatRate+'%',q(r2(e.gross-e.net).toFixed(2).replace('.',',')),q(e.gross.toFixed(2).replace('.',',')),q(e.note)].join(';')+'\n';});
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download='belege-'+this._periodLabel().replace(/[ /]/g,'-')+'.csv'; a.click(); },

  /* ---- USt-Voranmeldung ---- */
  t_ustva(el){
    const f=this.figures();
    if(f.small){ el.innerHTML=this.periodBar()+`<div class="card"><div class="empty"><div class="big">Kleinunternehmer §19 UStG</div>Du weist keine Umsatzsteuer aus und musst i. d. R. keine USt-Voranmeldung abgeben. Umstellbar in den Einstellungen → Firmenprofil.</div></div>`; return; }
    el.innerHTML=this.periodBar()+`

const Offer={
  async generate(custId){
    const c=DB.customers.find(x=>x.id===custId); if(!c)return;
    if(!CLOUD.on()&&!DB.settingsAI.apiKey){toast('KI nicht konfiguriert → Einstellungen → KI','err');return}
    toast('KI erstellt ein maßgeschneidertes Angebot…');
    const cat=(DB.catalog||[]);
    const priceList=cat.length?cat.map(x=>`- [${x.trade}] ${x.name} | ${x.unit} | ${x.price} EUR`).join('\n'):'(keine Preisliste)';
    const prompt=`Du bist ein Vertriebs-Kalkulator. Erstelle das überzeugendste, abschlussstärkste, faire Angebot für diesen Kunden – geerdet an der Preisliste.

PREISLISTE (Name | Einheit | Preis netto EUR):
${priceList}

KUNDENKONTEXT:
${_custContext(c)}

Gib AUSSCHLIESSLICH JSONL aus (kein Fließtext, keine Umschließung, kein Markdown):
- ERSTE Zeile Meta: {"intro":"1-2 Sätze persönliche Einleitung","outro":"1 Satz Abschluss/CTA"}
- Danach je Position EINE Zeile: {"desc":"","qty":1,"unit":"Pauschal","price":0,"estimated":false}
Regeln: passende Preislisten-Position exakt übernehmen (estimated=false). Fehlendes konservativ schätzen (estimated=true). Einheit nur aus: Pauschal,Stück,Std.,Tag,Monat,km. Keine erfundenen Zahlen. 4-12 Positionen.${aiLang()}`;
    try{
      const payload={model:'claude-sonnet-4-6',max_tokens:1600,messages:[{role:'user',content:prompt}]};
      let res; if(CLOUD.on()){ const {data:{session}}=await CLOUD.sb.auth.getSession();
        res=await fetch(CLOUD.url+'/functions/v1/ai-proxy',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify(payload)});
      }else{ res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':DB.settingsAI.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(payload)}); }
      const data=await res.json(); if(data.error)throw new Error(data.error.message);
      const txt=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
      const parsed=Offer._parse(txt);
      if(!parsed.items.length)throw new Error('keine verwertbaren Positionen erhalten');
      Modal.close(); Quotes.openNew(custId);
      setTimeout(()=>{ Docs.items=parsed.items; if(Docs.renderPos)Docs.renderPos(); if($('#q_intro'))$('#q_intro').value=parsed.intro||''; if($('#q_outro'))$('#q_outro').value=parsed.outro||''; toast(parsed.items.length+' Positionen – KI-Angebot bereit, bitte prüfen'); },120);
      Audit.log(`KI-Angebot erstellt für ${c.company}`,'ai',custId);
    }catch(e){ toast('KI-Angebot fehlgeschlagen: '+e.message,'err'); }
  },
  _parse(txt){
    const UNITS=['Pauschal','Stück','Std.','Tag','Monat','km'];
    const norm=p=>({desc:String(p.desc||'').slice(0,160),qty:Math.max(0,Number(p.qty)||1),unit:UNITS.includes(p.unit)?p.unit:(p.unit==='Stueck'?'Stück':'Pauschal'),discount:0,price:Math.round((Number(p.price)||0)*100)/100});
    let intro='',outro='',items=[];
    // 1) Zeilenweise (JSONL) – robust gegen abgeschnittene letzte Zeile
    txt.split('\n').forEach(line=>{
      let ln=line.trim().replace(/^```(json)?/i,'').replace(/```$/,'').trim().replace(/,\s*$/,'');
      if(!ln||ln[0]!=='{')return;
      let o; try{o=JSON.parse(ln)}catch(e){return}
      if(o&&(o.intro!==undefined||o.outro!==undefined)){ intro=o.intro||intro; outro=o.outro||outro; if(Array.isArray(o.positionen))o.positionen.forEach(p=>{if(p&&p.desc)items.push(norm(p))}); }
      else if(o&&o.desc){ items.push(norm(o)); }
    });
    // 2) Fallback: ganzes Objekt mit positionen[] (tolerant, Klammern reparieren)
    if(!items.length){
      let m=txt.match(/\{[\s\S]*\}/); let raw=m?m[0]:txt;
      let obj=null; try{obj=JSON.parse(raw)}catch(e){
        // Reparatur: Positionen einzeln aus dem Array fischen
        const arrM=raw.match(/"positionen"\s*:\s*\[([\s\S]*)/);
        if(arrM){ const objs=arrM[1].match(/\{[^{}]*\}/g)||[]; objs.forEach(o2=>{ try{const p=JSON.parse(o2); if(p&&p.desc)items.push(norm(p));}catch(_){}}); }
        const iM=raw.match(/"intro"\s*:\s*"([^"]*)"/); if(iM)intro=iM[1];
        const oM=raw.match(/"outro"\s*:\s*"([^"]*)"/); if(oM)outro=oM[1];
      }
      if(obj){ intro=obj.intro||''; outro=obj.outro||''; (obj.positionen||[]).forEach(p=>{if(p&&p.desc)items.push(norm(p))}); }
    }
    return {intro,outro,items};
  }
};

  if(sessionStorage.getItem('vop_demo_mode')){ try{Demo.boot()}catch(e){console.error(e)} return; }  // isolierter Sales-Demo-Modus

  migrateV2(); migrateV3(); migrateV6();
  Brand.apply();
  IDB.open().catch(()=>console.warn('IndexedDB nicht verfügbar'));
  if(CLOUD.on()){
    const ok=await CLOUD.init();
    if(!ok)return; // Gate sichtbar → wartet auf Magic-Link, Seite lädt danach neu
  }
  Auth.renderLogin();
  Auth.restore();
})();
</script>
</body>
</html>
