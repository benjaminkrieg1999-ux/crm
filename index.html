/* ---------- Kalender / Termine ---------- */
const Cal={
  view:'monat', anchor:new Date(),
  _fmtDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},
  _byDay(iso){return DB.appointments.filter(a=>a.start.slice(0,10)===iso).sort((a,b)=>a.start.localeCompare(b.start))},
  nav(dir){ const a=this.anchor;
    if(this.view==='monat')a.setMonth(a.getMonth()+dir);
    else if(this.view==='woche')a.setDate(a.getDate()+7*dir);
    else a.setDate(a.getDate()+dir);
    Router.go('calendar'); },
  today(){ this.anchor=new Date(); Router.go('calendar'); },
  setView(v){ this.view=v; Router.go('calendar'); },
  render(root){
    const V=[['monat','Monat'],['woche','Woche'],['tag','Tag'],['liste','Liste']];
    const title=this.view==='monat'?this.anchor.toLocaleDateString('de-DE',{month:'long',year:'numeric'})
      :this.view==='woche'?'KW '+this._kw(this.anchor)+' · '+this.anchor.toLocaleDateString('de-DE',{month:'long',year:'numeric'})
      :this.view==='tag'?this.anchor.toLocaleDateString('de-DE',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})
      :'Alle Termine';
    root.innerHTML=`<div class="vhead"><div><h1 class="display">Termine</h1><div class="hint">Klick auf einen Tag legt dort einen Termin an. Übergabe an Google/Apple/Outlook pro Termin.</div></div>
      <button class="btn gold" onclick="Cal.openForm()">+ Termin</button></div>
      <div class="calbar">
        <button class="btn sm" onclick="Cal.nav(-1)">‹</button>
        <button class="btn sm" onclick="Cal.today()">Heute</button>
        <button class="btn sm" onclick="Cal.nav(1)">›</button>
        <div class="title">${title}</div>
        <div class="tabs" style="margin:0">${V.map(([v,l])=>`<div class="tab ${this.view===v?'active':''}" onclick="Cal.setView('${v}')">${l}</div>`).join('')}</div>
      </div>
      <div id="calbody"></div>`;
    const b=$('#calbody');
    if(this.view==='monat')b.innerHTML=this.month();
    else if(this.view==='woche')b.innerHTML=this.week();
    else if(this.view==='tag')b.innerHTML=this.dayView();
    else b.innerHTML=this.listView();
  },
  _kw(d){const t=new Date(d);t.setHours(0,0,0,0);t.setDate(t.getDate()+3-((t.getDay()+6)%7));const w1=new Date(t.getFullYear(),0,4);return 1+Math.round(((t-w1)/864e5-3+((w1.getDay()+6)%7))/7)},
  month(){
    const a=this.anchor, first=new Date(a.getFullYear(),a.getMonth(),1);
    const startOff=(first.getDay()+6)%7; const start=new Date(first); start.setDate(1-startOff);
    const tod=this._fmtDate(new Date());
    let html='<div class="calgrid">'+['Mo','Di','Mi','Do','Fr','Sa','So'].map(d=>`<div class="dow">${d}</div>`).join('');
    for(let i=0;i<42;i++){ const d=new Date(start); d.setDate(start.getDate()+i); const iso=this._fmtDate(d);
      const apps=this._byDay(iso), other=d.getMonth()!==a.getMonth();
      html+=`<div class="calday ${other?'other':''} ${iso===tod?'today':''}" onclick="Cal.dayClick('${iso}')">
        <div class="dn">${d.getDate()}${apps.length?` <span class="cnt2" style="display:none">·${apps.length}</span>`:''}</div>
        ${apps.slice(0,3).map(x=>`<div class="calchip"><b>${x.start.slice(11,16)}</b> ${esc(x.title)}</div>`).join('')}
        ${apps.length>3?`<div class="calchip" style="color:var(--faint)">+${apps.length-3} weitere</div>`:''}
      </div>`; }
    return html+'</div>';
  },
  week(){
    const a=new Date(this.anchor); a.setDate(a.getDate()-((a.getDay()+6)%7));
    const tod=this._fmtDate(new Date());
    let html='<div class="weekgrid">';
    for(let i=0;i<7;i++){ const d=new Date(a); d.setDate(a.getDate()+i); const iso=this._fmtDate(d); const apps=this._byDay(iso);
      html+=`<div class="weekcol ${iso===tod?'today':''}">
        <div class="wh" onclick="Cal.dayClick('${iso}')" style="cursor:pointer">${d.toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit'})}</div>
        ${apps.map(x=>this._card(x)).join('')||'<div class="hint" style="font-size:11px;cursor:pointer" onclick="Cal.openForm(null,null,\''+iso+'\')">+ Termin</div>'}
      </div>`; }
    return html+'</div>';
  },
  dayView(){
    const iso=this._fmtDate(this.anchor), apps=this._byDay(iso);
    let html='<div class="card" style="padding:0;overflow:hidden">';
    for(let h=7;h<=20;h++){ const slot=apps.filter(x=>+x.start.slice(11,13)===h);
      html+=`<div class="dayrow"><div class="h">${String(h).padStart(2,'0')}:00</div><div style="padding:5px">
        ${slot.map(x=>this._card(x)).join('')||`<div style="height:100%;min-height:30px;cursor:pointer" onclick="Cal.openForm(null,null,'${iso}','${String(h).padStart(2,'0')}:00')"></div>`}
      </div></div>`; }
    const off=apps.filter(x=>{const h=+x.start.slice(11,13);return h<7||h>20});
    if(off.length)html+='<div style="padding:10px">'+off.map(x=>this._card(x)).join('')+'</div>';
    return html+'</div>';
  },
  _card(a){ const c=DB.customers.find(x=>x.id===a.customerId);
    return `<div class="calchip" style="padding:6px 8px;font-size:12px;cursor:pointer" onclick="Cal.openForm('${a.id}')">
      <b>${a.start.slice(11,16)}</b> ${esc(a.title)}${c?` · <span style="color:var(--muted)">${esc(c.company)}</span>`:''}
      <span style="float:right"><a href="${Cal.gcal(a)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="Google Kalender">G</a></span></div>`; },
  listView(){
    const list=[...DB.appointments].sort((a,b)=>a.start.localeCompare(b.start));
    if(!list.length)return '<div class="hint">Noch keine Termine.</div>';
    let html='',last='';
    list.forEach(a=>{const d=new Date(a.start).toLocaleDateString('de-DE',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
      if(d!==last){html+=`<div class="eyebrow" style="margin:18px 0 8px">${d}</div>`;last=d;}
      const c=DB.customers.find(x=>x.id===a.customerId);
      html+=`<div class="card" style="padding:12px 16px;display:flex;gap:12px;align-items:center;margin-bottom:7px">
        <div style="min-width:56px;font-family:var(--f-cond);font-size:18px;color:var(--gold)">${a.start.slice(11,16)}</div>
        <div style="flex:1"><b style="color:var(--ivory)">${esc(a.title)}</b><div style="font-size:12px;color:var(--muted)">${c?esc(c.company)+' · ':''}${esc(a.location||'')}</div></div>
        <a class="btn sm" href="${Cal.gcal(a)}" target="_blank" rel="noopener">G-Kalender</a>
        <button class="btn sm" onclick="Cal.ics('${a.id}')">.ics</button>
        <button class="btn sm" onclick="Cal.openForm('${a.id}')">✎</button>
        <button class="btn sm danger" onclick="Cal.remove('${a.id}')">✕</button></div>`;});
    return html;
  },
  dayClick(iso){ this.anchor=new Date(iso+'T12:00'); if(this._byDay(iso).length){this.setView('tag')}else{this.openForm(null,null,iso)} },
  openForm(id,custId,dateIso,timeStr){
    const a=id?DB.appointments.find(x=>x.id===id):null;
    const d=a?new Date(a.start):new Date(Date.now()+864e5); d.setMinutes(d.getMinutes()-d.getMinutes()%15,0,0);
    const dv=dateIso||(a?a.start.slice(0,10):this._fmtDate(d)), tv=timeStr||(a?a.start.slice(11,16):'10:00');
    Modal.open(`<div class="mhead"><h2 class="display">${a?'Termin bearbeiten':'Neuer Termin'}</h2><button class="iconbtn" onclick="Modal.close()">✕</button></div>
    <div class="mbody"><div class="grid2">
      <label class="fl" style="grid-column:1/-1">Titel<input class="in" id="ap_t" value="${esc(a?.title||'')}" placeholder="Vor-Ort-Termin / Beratung / Aufmaß"></label>
      <label class="fl">Kunde<select class="in" id="ap_c">${'<option value="">— kein Kunde —</option>'+DB.customers.map(c=>`<option value="${c.id}" ${(a?.customerId||custId)===c.id?'selected':''}>${esc(c.company)}</option>`).join('')}</select></label>
      <label class="fl">Ort<input class="in" id="ap_l" value="${esc(a?.location||'')}" placeholder="Beim Kunden / Büro / Telefonat"></label>
      <label class="fl">Datum<input class="in" id="ap_d" type="date" value="${dv}"></label>
      <label class="fl">Uhrzeit<input class="in" id="ap_h" type="time" value="${tv}"></label>
      <label class="fl">Dauer (Min)<input class="in" id="ap_m" type="number" value="${a?.duration||60}"></label>
      <label class="fl" style="grid-column:1/-1">Notizen<textarea class="in" id="ap_n" rows="3">${esc(a?.notes||'')}</textarea></label>
    </div><div class="hint" id="ap_conflict"></div></div>
    <div class="mfoot">${a?`<button class="btn danger" onclick="Cal.remove('${a.id}');Modal.close()">Löschen</button>`:'<span></span>'}
      <div style="display:flex;gap:8px"><button class="btn" onclick="Modal.close()">Abbrechen</button><button class="btn gold" onclick="Cal.save('${a?.id||''}')">Speichern</button></div></div>`);
  },
  save(id){
    const t=$('#ap_t').value.trim(); if(!t){toast('Titel fehlt','err');return}
    const start=$('#ap_d').value+'T'+$('#ap_h').value, dur=+$('#ap_m').value||60;
    const s0=new Date(start).getTime(), e0=s0+dur*6e4;
    const clash=DB.appointments.find(x=>x.id!==id&&(()=>{const s1=new Date(x.start).getTime(),e1=s1+(x.duration||60)*6e4;return s0<e1&&s1<e0})());
    if(clash&&!confirm('⚠ Überschneidung mit „'+clash.title+'" ('+clash.start.slice(11,16)+' Uhr). Trotzdem speichern?'))return;
    const data={title:t,customerId:$('#ap_c').value||null,location:$('#ap_l').value.trim(),start,duration:dur,notes:$('#ap_n').value.trim()};
    if(id)commit(`Termin „${t}" geändert`,()=>Object.assign(DB.appointments.find(x=>x.id===id),data),'calendar',data.customerId);
    else{const nid=uid();commit(`Termin „${t}" angelegt`,()=>DB.appointments.push(Object.assign({id:nid},data)),'calendar',data.customerId);}
    Modal.close(); this.anchor=new Date(start); if(Router.cur==='calendar')Router.go('calendar'); toast('Termin gespeichert');
  },
  remove(id){const a=DB.appointments.find(x=>x.id===id); if(!a||!confirm('Termin löschen?'))return;
    commit(`Termin „${a.title}" gelöscht`,()=>{DB.appointments=DB.appointments.filter(x=>x.id!==id)},'calendar',a.customerId); if(Router.cur==='calendar')Router.go('calendar');},
  _dt(a){const s=new Date(a.start),e=new Date(s.getTime()+(a.duration||60)*6e4);
    const f=d=>d.toISOString().replace(/[-:]/g,'').slice(0,15)+'Z'; return [f(s),f(e)];},
  gcal(a){const [s,e]=this._dt(a);const c=DB.customers.find(x=>x.id===a.customerId);
    const det=[(c?'Kunde: '+c.company:''),a.notes||''].filter(Boolean).join('\n');
    return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(a.title)+'&dates='+s+'/'+e+'&details='+encodeURIComponent(det)+'&location='+encodeURIComponent(a.location||'');},
  ics(id){const a=DB.appointments.find(x=>x.id===id);const [s,e]=this._dt(a);
    const ics='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Operator//DE\r\nBEGIN:VEVENT\r\nUID:'+a.id+'@operator\r\nDTSTART:'+s+'\r\nDTEND:'+e+'\r\nSUMMARY:'+a.title.replace(/[,;\\]/g,' ')+'\r\nLOCATION:'+(a.location||'').replace(/[,;\\]/g,' ')+'\r\nDESCRIPTION:'+(a.notes||'').replace(/[\r\n,;\\]/g,' ')+'\r\nEND:VEVENT\r\nEND:VCALENDAR';
    const el=document.createElement('a'); el.href='data:text/calendar;charset=utf-8,'+encodeURIComponent(ics); el.download='termin.ics'; el.click();}
};

/* ---------- Recruiting-Pipeline ---------- */
const REC_STAGES=['Neu','Kontaktiert','Gespräch','Probearbeit','Eingestellt'];
const Recruiting={
  render(root){
    const cols=REC_STAGES.map(st=>{
      const cards=DB.applicants.filter(a=>a.stage===st).map(a=>`
        <div class="kcard" draggable="true" ondragstart="event.dataTransfer.setData('text','${a.id}')" onclick="Recruiting.openForm('${a.id}')">
          <div class="f">${esc(a.name)}</div><div class="m">${esc(a.position||'—')}${a.source?' · '+esc(a.source):''}</div>
          ${a.phone?`<div class="m"><a href="tel:${esc(a.phone.replace(/[^+\d]/g,''))}" onclick="event.stopPropagation()">📞 ${esc(a.phone)}</a></div>`:''}
        </div>`).join('');
      return `<div class="kcol" ondragover="event.preventDefault();this.classList.add('dragover')" ondragleave="this.classList.remove('dragover')"
        ondrop="this.classList.remove('dragover');Recruiting.move(event.dataTransfer.getData('text'),'${st}')">
        <div style="padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between"><span class="eyebrow">${st}</span><span style="font-size:11px;color:var(--faint)">${DB.applicants.filter(a=>a.stage===st).length}</span></div>
        <div style="padding:10px;display:flex;flex-direction:column;gap:8px">${cards}</div></div>`;
    }).join('');
    const lost=DB.applicants.filter(a=>a.stage==='Absage');
    root.innerHTML=`<div class="vhead"><div><h1 class="display">Recruiting</h1><div class="hint">Bewerber per Drag & Drop durch die Phasen ziehen.</div></div>
      <button class="btn gold" onclick="Recruiting.openForm()">+ Bewerber</button></div>
      <div class="kanban">${cols}</div>
      ${lost.length?`<div class="eyebrow" style="margin:20px 0 8px">Absagen (${lost.length})</div><div style="font-size:12.5px;color:var(--muted)">${lost.map(a=>`<a onclick="Recruiting.openForm('${a.id}')">${esc(a.name)}</a>`).join(' · ')}</div>`:''}`;
  },
  move(id,st){const a=DB.applicants.find(x=>x.id===id); if(!a||a.stage===st)return;
    commit(`Bewerber „${a.name}" → ${st}`,()=>{a.stage=st},'recruiting',id); Router.go('recruiting');
    if(st==='Eingestellt')toast('🎉 Eingestellt – Glückwunsch!');},
  openForm(id){
    const a=id?DB.applicants.find(x=>x.id===id):null;
    Modal.open(`<div class="mhead"><h2 class="display">${a?esc(a.name):'Neuer Bewerber'}</h2><button class="iconbtn" onclick="Modal.close()">✕</button></div>
    <div class="mbody"><div class="grid2">
      <label class="fl">Name<input class="in" id="rc_n" value="${esc(a?.name||'')}"></label>
      <label class="fl">Beworben als<input class="in" id="rc_p" value="${esc(a?.position||'')}" placeholder="Elektriker / PTA / Vertrieb…"></label>
      <label class="fl">Telefon<input class="in" id="rc_t" value="${esc(a?.phone||'')}"></label>
      <label class="fl">E-Mail<input class="in" id="rc_e" value="${esc(a?.email||'')}"></label>
      <label class="fl">Quelle<select class="in" id="rc_q">${['Website','Social Ads','Indeed/Portal','Empfehlung','Initiativ','Sonstiges'].map(x=>`<option ${a?.source===x?'selected':''}>${x}</option>`).join('')}</select></label>
      <label class="fl">Phase<select class="in" id="rc_s">${REC_STAGES.concat('Absage').map(x=>`<option ${a?.stage===x?'selected':''}>${x}</option>`).join('')}</select></label>
      <label class="fl" style="grid-column:1/-1">Notizen (Gesprächseindruck, Gehalt, Verfügbarkeit…)<textarea class="in" id="rc_no" rows="4">${esc(a?.notes||'')}</textarea></label>
    </div></div>
    <div class="mfoot">${a?`<button class="btn danger" onclick="Recruiting.remove('${a.id}')">Löschen</button>`:'<span></span>'}
      <div style="display:flex;gap:8px"><button class="btn" onclick="Modal.close()">Abbrechen</button><button class="btn gold" onclick="Recruiting.save('${a?.id||''}')">Speichern</button></div></div>`);
  },
  save(id){
    const n=$('#rc_n').value.trim(); if(!n){toast('Name fehlt','err');return}
    const data={name:n,position:$('#rc_p').value.trim(),phone:$('#rc_t').value.trim(),email:$('#rc_e').value.trim(),source:$('#rc_q').value,stage:$('#rc_s').value,notes:$('#rc_no').value};
    if(id)commit(`Bewerber „${n}" bearbeitet`,()=>Object.assign(DB.applicants.find(x=>x.id===id),data),'recruiting',id);
    else{const nid=uid();commit(`Bewerber „${n}" angelegt`,()=>DB.applicants.push(Object.assign({id:nid,created:new Date().toISOString()},data)),'recruiting',nid);}
    Modal.close(); Router.go('recruiting');
  },
  remove(id){if(!confirm('Bewerber endgültig löschen? (DSGVO: nach Absage max. 6 Monate aufbewahren)'))return;
    const a=DB.applicants.find(x=>x.id===id);
    commit(`Bewerber „${a.name}" gelöscht`,()=>{DB.applicants=DB.applicants.filter(x=>x.id!==id)},'recruiting',id); Modal.close(); Router.go('recruiting');}
};

/* ---------- Blitz-Angebot: Positions-Katalog ---------- */
const Catalog={
  pick(){
    if($('#q_cust')||$('#i_cust'))this._snap();
    const trades=[...new Set(DB.catalog.map(c=>c.trade))];
    Modal.open(`<div class="mhead"><div><div class="eyebrow">Blitz-Angebot</div><h2 class="display">Positionen aus dem Katalog</h2></div><button class="iconbtn" onclick="Catalog.done()">✕</button></div>
    <div class="mbody">
      <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
        <input class="in" id="cat_q" placeholder="Suchen…" style="flex:1;min-width:160px" oninput="Catalog.renderList()">
        <select class="in" id="cat_t" style="width:auto" onchange="Catalog.renderList()"><option value="">Alle Gewerke</option>${trades.map(t=>`<option>${esc(t)}</option>`).join('')}</select>
        <button class="btn sm" onclick="Catalog.edit()">Katalog bearbeiten</button>
      </div>
      <div id="cat_list"></div>
      <div class="hint" style="margin-top:10px">Mit „(Beispiel)" markierte Preise sind Platzhalter – vor dem ersten echten Angebot durch eure Kalkulation ersetzen.</div>
    </div>
    <div class="mfoot"><span class="hint" id="cat_sum"></span><button class="btn gold" onclick="Catalog.done()">Übernehmen & schließen</button></div>`,'xl');
    this.renderList();
  },
  renderList(){
    const q=($('#cat_q')?.value||'').toLowerCase(), t=$('#cat_t')?.value||'';
    const rows=DB.catalog.filter(c=>(!t||c.trade===t)&&(!q||c.name.toLowerCase().includes(q))).map(c=>`
      <div style="display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line)">
        <div style="flex:1"><span style="color:var(--ivory)">${esc(c.name)}</span> <span style="font-size:11px;color:var(--faint)">· ${esc(c.trade)} · ${eur(c.price)}/${esc(c.unit)}</span></div>
        <input class="in" type="number" min="1" value="1" id="qty_${c.id}" style="width:70px;padding:6px 8px">
        <button class="btn sm gold" onclick="Catalog.add('${c.id}')">+ hinzufügen</button>
      </div>`).join('');
    $('#cat_list').innerHTML=rows||'<div class="hint">Keine Treffer.</div>';
    this.sum();
  },
  add(id){
    const c=DB.catalog.find(x=>x.id===id), qty=+($('#qty_'+id)?.value||1);
    if(Docs.items.length===1&&!Docs.items[0].desc&&!Docs.items[0].price)Docs.items=[];
    Docs.items.push({desc:c.name.replace(' (Beispiel)',''),qty,unit:c.unit,discount:0,price:c.price});
    toast(qty+'× '+c.name+' übernommen'); this.sum();
  },
  sum(){ const s=Docs.items.reduce((a,i)=>a+i.qty*i.price*(1-(i.discount||0)/100),0);
    const el=$('#cat_sum'); if(el)el.textContent=Docs.items.length+' Positionen · '+eur(s)+' netto'; },
  done(){
    const items=JSON.parse(JSON.stringify(Docs.items)), ctx=Docs._ctx||{kind:'quote',id:''}, f=this._fields||{};
    Modal.close();
    if(ctx.kind==='invoice')Invoices.form(ctx.id||null,f.cust); else Quotes.form(ctx.id||null,f.cust);
    /* Felder & Positionen wiederherstellen */
    const set=(id,v)=>{const el=$('#'+id);if(el&&v!==undefined)el.value=v};
    if(ctx.kind==='invoice'){set('i_cust',f.cust);set('i_date',f.date);set('i_due',f.due);}
    else{set('q_cust',f.cust);set('q_date',f.date);set('q_valid',f.valid);set('q_intro',f.intro);set('q_outro',f.outro);}
    Docs.items=items; Docs.renderPos();
    toast(items.filter(i=>i.desc).length+' Positionen im Angebot – prüfen & speichern');
  },
  _snap(){
    const g=id=>$('#'+id)?.value;
    if($('#i_cust'))this._fields={cust:g('i_cust'),date:g('i_date'),due:g('i_due')};
    else this._fields={cust:g('q_cust'),date:g('q_date'),valid:g('q_valid'),intro:g('q_intro'),outro:g('q_outro')};
  },
  edit(){
    Modal.open(`<div class="mhead"><h2 class="display">Katalog bearbeiten</h2><button class="iconbtn" onclick="Catalog.pick()">← zurück</button></div>
    <div class="mbody"><div id="cat_edit">${DB.catalog.map(c=>`
      <div style="display:grid;grid-template-columns:110px 1fr 90px 100px 34px;gap:8px;margin-bottom:7px" data-cid="${c.id}">
        <input class="in" value="${esc(c.trade)}" data-f="trade"><input class="in" value="${esc(c.name)}" data-f="name">
        <input class="in" value="${esc(c.unit)}" data-f="unit"><input class="in" type="number" step="0.01" value="${c.price}" data-f="price">
        <button class="iconbtn" onclick="this.parentElement.remove()">✕</button>
      </div>`).join('')}</div>
      <button class="btn sm" onclick="Catalog.addRow()">+ Katalog-Position</button></div>
    <div class="mfoot"><button class="btn" onclick="Catalog.pick()">Abbrechen</button><button class="btn gold" onclick="Catalog.saveEdit()">Katalog speichern</button></div>`,'xl');
  },
  addRow(){ const d=document.createElement('div'); d.style.cssText='display:grid;grid-template-columns:110px 1fr 90px 100px 34px;gap:8px;margin-bottom:7px'; d.dataset.cid='';
    d.innerHTML='<input class="in" placeholder="Gewerk" data-f="trade"><input class="in" placeholder="Bezeichnung" data-f="name"><input class="in" placeholder="Einheit" data-f="unit"><input class="in" type="number" step="0.01" placeholder="€ netto" data-f="price"><button class="iconbtn" onclick="this.parentElement.remove()">✕</button>';
    $('#cat_edit').appendChild(d); },

/* ---------- Custom Fields im Kundenformular & Detail ---------- */
const CustomFields={
  formHTML(c){
    const cur=effPack(c);
    const sw='<div style="display:flex;gap:10px;align-items:center;margin:16px 0 10px"><span class="eyebrow" style="margin:0">Branchen-Ansicht</span>'
      +'<select class="in" id="f_pack" style="max-width:240px" onchange="CustomFields.switch(this.value)">'
      +Object.entries(INDUSTRY_PACKS).map(([k,p])=>'<option value="'+k+'"'+(cur===k?' selected':'')+'>'+p.label+'</option>').join('')+'</select></div>';
    this._stash=Object.assign({},c?.custom||{});
    return sw+'<div id="cf_zone">'+this.zone(cur,c)+'</div>';
  },
  zone(pack,c){
    const fs=(INDUSTRY_PACKS[pack]||INDUSTRY_PACKS.none).fields.concat(DB.customFields||[]); if(!fs.length)return '<div class="hint">Standard-CRM ohne Zusatzfelder.</div>';
    return '<div class="frow">'
      +fs.map((f,i)=>{const v=c?.custom?.[f.id]??'';
        const inp=f.type==='select'?`<select class="in" data-cf="${f.id}"><option value=""></option>${f.options.map(o=>`<option${v===o?' selected':''}>${o}</option>`).join('')}</select>`
          :`<input class="in" data-cf="${f.id}" type="${f.type}" value="${esc(String(v))}">`;
        return `<div class="field"><label>${esc(f.label)}</label>${inp}</div>`+((i%2)?'</div><div class="frow">':'');
      }).join('')+'</div>';
  },
  _stash:{},
  switch(pack){
    /* eingegebene Werte über alle Ansichten hinweg behalten */
    document.querySelectorAll('[data-cf]').forEach(el=>{if(el.value)this._stash[el.dataset.cf]=el.value});
    $('#cf_zone').innerHTML=this.zone(pack,{custom:this._stash});
  },
  collect(){ const o=Object.assign({},this._stash); document.querySelectorAll('[data-cf]').forEach(el=>{if(el.value)o[el.dataset.cf]=el.value;else delete o[el.dataset.cf]}); return o; },
  detailHTML(c){
    const fs=packFields(c).filter(f=>c.custom?.[f.id]); if(!fs.length)return '';
    return fs.map(f=>`<div class="k">${esc(f.label)}</div><div class="v">${esc(String(c.custom[f.id]))}</div>`).join('');
  }
};

  toggle(id){ const t=DB.tasks.find(x=>x.id===id);
    commit(`Aufgabe „${t.title}" ${t.done?'wieder geöffnet':'erledigt'}`,()=>{t.done=!t.done},'crm',t.customerId); Customers.openDetail(t.customerId); },
  remove(id){ const t=DB.tasks.find(x=>x.id===id);
    commit(`Aufgabe „${t.title}" gelöscht`,()=>{DB.tasks=DB.tasks.filter(x=>x.id!==id)},'crm',t.customerId); Customers.openDetail(t.customerId); }

/* ---------- PV-Dachplaner: Module aufs Dachfoto zeichnen ---------- */
const Planner={
  st:null,
  open(custId){
    const c=DB.customers.find(x=>x.id===custId); if(!c)return;
    this.st={custId,modules:(c.roofPlan?.modules||[]).map(m=>({...m})),wp:c.roofPlan?.wp||440,mw:c.roofPlan?.mw||46,rot:false,img:null};
    Modal.open(`<div class="mhead"><div><div class="eyebrow">PV-Dachplaner</div><h2 class="display">${esc(c.company)}</h2></div><button class="iconbtn" onclick="Modal.close()">✕</button></div>
    <div class="mbody">
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px">
        <label class="btn sm" style="cursor:pointer">📷 Dachfoto laden<input type="file" accept="image/*" style="display:none" onchange="Planner.photo(this.files[0])"></label>
        <input class="in" id="pl_addr" placeholder="Adresse für Satellitenbild" value="${esc([c.street,c.zip,c.city].filter(Boolean).join(', '))}" style="width:230px;padding:5px 8px">
        <button class="btn sm gold" onclick="Planner.satellite()">🛰 Satellit laden</button>

        <label style="font-size:12px;color:var(--muted)">Modulgröße <input type="range" min="20" max="90" value="46" oninput="Planner.st.mw=+this.value;Planner.draw()" style="vertical-align:middle"></label>
        <label style="font-size:12px;color:var(--muted)">Wp/Modul <input class="in" type="number" value="${this.st.wp}" style="width:80px;padding:5px 8px" oninput="Planner.st.wp=+this.value||440;Planner.stats()"></label>
        <button class="btn sm" onclick="Planner.st.modules=[];Planner.draw()">Leeren</button>
      </div>
      <canvas id="pl_cv" width="900" height="520" style="width:100%;border:1px solid var(--line);border-radius:10px;background:#1a1a20;cursor:crosshair;touch-action:none"></canvas>
      <div class="hint" style="margin-top:8px">Klick platziert ein Modul · Klick auf ein Modul entfernt es · Foto ist optional (Raster geht auch ohne).</div>
      <div id="pl_stats" style="margin-top:10px;font-family:var(--f-cond);font-size:18px;color:var(--gold)"></div>
    </div>
    <div class="mfoot"><button class="btn" onclick="Planner.saveImg()">🖼 Als Bild sichern</button>
      <div style="display:flex;gap:8px"><button class="btn" onclick="Planner.persist(true)">Speichern</button>
      <button class="btn gold" onclick="Planner.toQuote()">⚡ Ins Angebot übernehmen</button></div></div>`,'xl');
    const cv=$('#pl_cv');
    cv.addEventListener('pointerdown',e=>this.tap(e));
    if(c.roofPlan?.imgId)IDB.get('plan_'+custId).then(b=>{if(b){const u=URL.createObjectURL(b);const im=new Image();im.onload=()=>{this.st.img=im;this.draw()};im.src=u;}}).catch(()=>{});
    this.draw();
  },
  photo(f){ if(!f)return; const im=new Image(); im.onload=()=>{this.st.img=im;this.st.imgBlob=f;this.draw()}; im.src=URL.createObjectURL(f); },
  satellite(){
    const key=(DB.company.mapsKey||'').trim();
    if(!key){ this.askKey(); return; }
    const addr=($('#pl_addr').value||'').trim();
    if(!addr){toast('Adresse eingeben','err');return}
    toast('Lade Satellitenbild…');
    const url='https://maps.googleapis.com/maps/api/staticmap?center='+encodeURIComponent(addr)+'&zoom=20&size=640x640&scale=2&maptype=satellite&key='+encodeURIComponent(key);
    const im=new Image(); im.crossOrigin='anonymous';
    im.onload=()=>{ this.st.img=im; this.st.imgBlob=null; this.draw(); toast('Satellitenbild geladen – Module platzieren'); };
    im.onerror=()=>toast('Konnte Bild nicht laden – Adresse und Google-Maps-Key prüfen (Static Maps API aktiv?)','err');
    im.src=url;
  },
  askKey(){
    Modal.open(`<div class="mhead"><h2 class="display">Google-Maps-Key</h2><button class="iconbtn" onclick="Modal.close()">✕</button></div>
    <div class="mbody"><div class="hint" style="margin-bottom:12px">Für Satellitenbilder wird ein Google-Maps-API-Key mit aktivierter <b>Maps Static API</b> benötigt. Der Key wird im Firmenprofil gespeichert. Tipp: In der Google Cloud Console den Key per <b>HTTP-Referrer</b> auf deine Vercel-Domain beschränken, damit er nicht missbraucht werden kann.</div>
      <label class="fl">API-Key<input class="in" id="pl_key" placeholder="AIza…"></label>
    </div><div class="mfoot"><button class="btn" onclick="Modal.close()">Abbrechen</button><button class="btn gold" onclick="const k=$('#pl_key').value.trim();if(k){commit('Google-Maps-Key gespeichert',()=>{DB.company.mapsKey=k},'settings');Modal.close();toast('Key gespeichert – erneut auf Satellit laden tippen');}">Speichern</button></div>`);
  },
  dims(){ const w=this.st.mw, h=Math.round(w*1.72); return this.st.rot?[h,w]:[w,h]; },
  tap(e){ const cv=$('#pl_cv'), r=cv.getBoundingClientRect();
    const x=(e.clientX-r.left)*cv.width/r.width, y=(e.clientY-r.top)*cv.height/r.height;
    const hit=this.st.modules.findIndex(m=>{const [w,h]=[m.w,m.h];return x>=m.x&&x<=m.x+w&&y>=m.y&&y<=m.y+h});
    if(hit>-1)this.st.modules.splice(hit,1);
    else{const [w,h]=this.dims(); this.st.modules.push({x:x-w/2,y:y-h/2,w,h});}
    this.draw(); },
  draw(){ const cv=$('#pl_cv'); if(!cv)return; const g=cv.getContext('2d');
    g.clearRect(0,0,cv.width,cv.height);
    if(this.st.img){ const im=this.st.img,s=Math.min(cv.width/im.width,cv.height/im.height);
      g.drawImage(im,(cv.width-im.width*s)/2,(cv.height-im.height*s)/2,im.width*s,im.height*s); }
    else{ g.strokeStyle='#26262e'; for(let x=0;x<cv.width;x+=30){g.beginPath();g.moveTo(x,0);g.lineTo(x,cv.height);g.stroke()} for(let y=0;y<cv.height;y+=30){g.beginPath();g.moveTo(0,y);g.lineTo(cv.width,y);g.stroke()} }
    this.st.modules.forEach((m,i)=>{ g.fillStyle='rgba(30,60,120,.72)'; g.strokeStyle='#c9a24b'; g.lineWidth=1.5;
      g.fillRect(m.x,m.y,m.w,m.h); g.strokeRect(m.x,m.y,m.w,m.h);
      g.strokeStyle='rgba(255,255,255,.25)'; g.beginPath(); g.moveTo(m.x+m.w/2,m.y); g.lineTo(m.x+m.w/2,m.y+m.h); g.stroke();
      g.fillStyle='#eee'; g.font='10px Inter'; g.fillText(i+1,m.x+3,m.y+11); });
    this.stats(); },
  stats(){ const n=this.st.modules.length, kwp=(n*this.st.wp/1000);
    const el=$('#pl_stats'); if(el)el.textContent=n+' Module · '+kwp.toFixed(2).replace('.',',')+' kWp geplant'; },
  async persist(showToast){
    const {custId,modules,wp,mw}=this.st; const c=DB.customers.find(x=>x.id===custId);
    if(this.st.imgBlob){ try{ await IDB.put('plan_'+custId,this.st.imgBlob); }catch(e){} }
    commit(`Dachplan bei „${c.company}" gespeichert (${modules.length} Module)`,()=>{c.roofPlan={modules,wp,mw,imgId:this.st.imgBlob||c.roofPlan?.imgId?'plan_'+custId:null,kwp:+(modules.length*wp/1000).toFixed(2)}},'crm',custId);
    if(showToast)toast('Dachplan gespeichert');
  },
  async toQuote(){
    await this.persist(false);
    const n=this.st.modules.length; if(!n){toast('Erst Module platzieren','err');return}
    const kwp=(n*this.st.wp/1000).toFixed(2).replace('.',',');
    const custId=this.st.custId;
    Modal.close();
    Quotes.form(null,custId);
    Docs.items=[{desc:'PV-Modul '+this.st.wp+' Wp inkl. Montage (lt. Dachplan: '+n+' Module / '+kwp+' kWp)',qty:n,unit:'Stück',discount:0,price:(DB.catalog.find(c=>c.name.includes('PV-Modul'))?.price)||0}];
    Docs.renderPos();
    toast(n+' Module als Angebotsposition übernommen – Preis prüfen, Rest per Blitz-Katalog ergänzen');
  },
  saveImg(){ const cv=$('#pl_cv'); const a=document.createElement('a'); a.href=cv.toDataURL('image/png'); a.download='dachplan.png'; a.click(); }
};

const Leads={

  importDlg(){

  parse(file){
    if(!file)return;
    const rd=new FileReader();
    rd.onload=()=>{
      let txt=rd.result.replace(/^\uFEFF/,'');
      const delim=(txt.split('\n')[0].match(/;/g)||[]).length>=(txt.split('\n')[0].match(/,/g)||[]).length?';':',';
      const rows=[];let row=[],cur='',inQ=false;
      for(let i=0;i<txt.length;i++){const ch=txt[i];
        if(inQ){ if(ch==='"'){ if(txt[i+1]==='"'){cur+='"';i++;} else inQ=false; } else cur+=ch; }
        else{ if(ch==='"')inQ=true;
          else if(ch===delim){row.push(cur);cur='';}
          else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&txt[i+1]==='\n')i++; row.push(cur);cur=''; if(row.some(c=>c.trim()))rows.push(row); row=[]; }
          else cur+=ch; } }
      if(cur||row.length){row.push(cur);if(row.some(c=>c.trim()))rows.push(row);}
      if(rows.length<2){toast('Keine Datenzeilen gefunden','err');return}
      this._head=rows[0].map(h=>h.trim()); this._rows=rows.slice(1);
      const FIELDS=[['company','Firma *'],['contactFirst','Vorname'],['contactLast','Nachname'],['salutation','Anrede'],['email','E-Mail'],['phone','Telefon'],['street','Straße'],['city','PLZ/Ort'],['industry','Branche'],['website','Website'],['stage','Phase'],['notes','Notiz']];
      const guess=f=>{const pat={company:/firma|company|unternehmen|name$/i,contactFirst:/vorname|first/i,contactLast:/nachname|last|surname/i,salutation:/anrede|salut/i,email:/mail/i,phone:/tel|phone|mobil|handy/i,street:/stra|street|adresse|address/i,city:/plz|ort|city|stadt/i,industry:/branche|industry|gewerk/i,website:/web|url|homepage|site/i,stage:/phase|status|pipeline|stufe/i,notes:/notiz|note|bemerk/i}[f];
        return this._head.findIndex(h=>pat&&pat.test(h)); };
      $('#imp_map').innerHTML=`<div class="eyebrow" style="margin-bottom:10px">${this._rows.length} Zeilen erkannt · Spalten zuordnen</div>
        <div class="grid2">${FIELDS.map(([f,l])=>`<label class="fl">${l}<select class="in" data-map="${f}"><option value="-1">— nicht importieren —</option>${this._head.map((h,i)=>`<option value="${i}" ${guess(f)===i?'selected':''}>${esc(h)}</option>`).join('')}</select></label>`).join('')}</div>
        <label class="fl" style="display:block;margin-top:12px">Betreuer für alle importierten Leads<select class="in" id="imp_owner" style="max-width:260px">${DB.users.filter(u=>u.active).map(u=>`<option value="${u.id}" ${u.id===Auth.user.id?'selected':''}>${esc(u.name)}</option>`).join('')}</select></label>
        <div class="hint" style="margin-top:8px">Dubletten (gleiche E-Mail oder gleicher Firmenname) werden automatisch übersprungen.</div>`;
      $('#imp_go').style.display='';
    };
    rd.readAsText(file,'utf-8');
  },
  run(){
    const map={}; document.querySelectorAll('[data-map]').forEach(el=>{if(+el.value>=0)map[el.dataset.map]=+el.value});
    if(map.company===undefined){toast('Bitte mindestens die Firma-Spalte zuordnen','err');return}
    const owner=$('#imp_owner').value;
    const exEmail=new Set(DB.customers.map(c=>(c.email||'').toLowerCase()).filter(Boolean));
    const exComp=new Set(DB.customers.map(c=>c.company.toLowerCase().trim()));
    let ok=0,skip=0;const items=[];
    this._rows.forEach(r=>{
      const g=f=>map[f]!==undefined?(r[map[f]]||'').trim():'';
      const company=g('company'); if(!company){skip++;return}
      const email=g('email').toLowerCase();
      if((email&&exEmail.has(email))||exComp.has(company.toLowerCase().trim())){skip++;return}
      exComp.add(company.toLowerCase().trim()); if(email)exEmail.add(email);
      let sal=g('salutation'); sal=/frau|mrs|ms/i.test(sal)?'Frau':'Herr';
      const ALL_STAGES=[...STAGES,'Verloren'];
      let st=g('stage'); st=ALL_STAGES.find(x=>x.toLowerCase()===st.toLowerCase())||'Neu';
      items.push({id:uid(),company,contactFirst:g('contactFirst'),contactLast:g('contactLast'),salutation:sal,email:g('email'),phone:g('phone'),street:g('street'),city:g('city'),industry:g('industry'),website:g('website'),notes:g('notes'),stage:st,dealValue:0,ownerId:owner,created:new Date().toISOString(),updated:new Date().toISOString(),history:[]});
      ok++;
    });
    if(!ok){toast('Nichts zu importieren ('+skip+' Dubletten/leer übersprungen)','err');return}
    commit('Lead-Import: '+ok+' Leads importiert, '+skip+' übersprungen',()=>{DB.customers.push(...items)},'crm');
    Modal.close(); Router.go('customers'); toast(ok+' Leads importiert · '+skip+' übersprungen');
  },
  /* ---------- Export: deutsches Excel-CSV (BOM + Semikolon) ---------- */
  export(){
    const cols=[['company','Firma'],['salutation','Anrede'],['contactFirst','Vorname'],['contactLast','Nachname'],['email','E-Mail'],['phone','Telefon'],['street','Straße'],['city','PLZ/Ort'],['industry','Branche'],['website','Website'],['stage','Phase'],['dealValue','Deal-Wert'],['followUp','Wiedervorlage'],['notes','Notizen']];
    const q=v=>{v=String(v??'');return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
    const owner=id=>DB.users.find(u=>u.id===id)?.name||'';
    let csv='\uFEFF'+cols.map(c=>c[1]).join(';')+';Betreuer\n';
    DB.customers.forEach(c=>{csv+=cols.map(([k])=>q(c[k])).join(';')+';'+q(owner(c.ownerId))+'\n';});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
    a.download='leads-export-'+today()+'.csv'; a.click();
    commit('Lead-Export: '+DB.customers.length+' Datensätze',()=>{},'crm');
  }
};

/* ---------- Power-Dialer: Liste laden → durchtelefonieren wie in Close ---------- */
const Dialer={
  q:[],i:0,started:0,stats:null,
  start(){
    Modal.open(`<div class="mhead"><div><div class="eyebrow">Power-Dialer</div><h2 class="display">Session starten</h2></div><button class="iconbtn" onclick="Modal.close()">✕</button></div>
    <div class="mbody"><div class="grid2">
      <label class="fl">Phase<select class="in" id="dl_stage"><option value="">Alle</option>${[...STAGES].map(s=>`<option${s==='Neu'?' selected':''}>${s}</option>`).join('')}</select></label>
      <label class="fl">Betreuer<select class="in" id="dl_owner"><option value="">Alle</option>${DB.users.filter(u=>u.active).map(u=>`<option value="${u.id}" ${u.id===Auth.user.id?'selected':''}>${esc(u.name)}</option>`).join('')}</select></label>
      <label class="fl">Nur mit Telefonnummer<select class="in" id="dl_tel"><option value="1" selected>Ja</option><option value="">Alle</option></select></label>
      <label class="fl">Reihenfolge<select class="in" id="dl_sort"><option value="old">Älteste zuerst</option><option value="new">Neueste zuerst</option><option value="follow">Wiedervorlage zuerst</option></select></label>
    </div></div>
    <div class="mfoot"><button class="btn" onclick="Modal.close()">Abbrechen</button><button class="btn gold" onclick="Dialer.go()">▶ Session starten</button></div>`);
  },
  go(){
    const st=$('#dl_stage').value,ow=$('#dl_owner').value,tel=$('#dl_tel').value,srt=$('#dl_sort').value;
    this.q=DB.customers.filter(c=>(!st||c.stage===st)&&(!ow||c.ownerId===ow)&&(!tel||c.phone)&&c.stage!=='Verloren');
    if(srt==='new')this.q.sort((a,b)=>(b.created||'').localeCompare(a.created||''));
    else if(srt==='follow')this.q.sort((a,b)=>(a.followUp||'9999').localeCompare(b.followUp||'9999'));
    else this.q.sort((a,b)=>(a.created||'').localeCompare(b.created||''));
    if(!this.q.length){toast('Keine Leads für diesen Filter','err');return}
    this.i=0; this.started=Date.now(); this.stats={done:0,reached:0,appt:0};
    this.screen();
  },
  screen(){
    if(this.i>=this.q.length){this.finish();return}
    const c=this.q[this.i], tel=(c.phone||'').replace(/[^+\d]/g,'');
    const last=DB.calls.filter(x=>x.customerId===c.id).slice(-1)[0];
    Modal.open(`<div class="mhead"><div><div class="eyebrow">Power-Dialer · ${this.i+1} / ${this.q.length}</div><h2 class="display">${esc(c.company)}</h2></div>
      <button class="iconbtn" onclick="Dialer.finish()">✕ Beenden</button></div>
    <div class="mbody">
      <div style="height:5px;background:var(--line);border-radius:3px;margin-bottom:16px"><div style="height:5px;width:${Math.round(this.i/this.q.length*100)}%;background:var(--gold);border-radius:3px"></div></div>
      <div class="kvs" style="margin-bottom:14px">
        <div class="k">Kontakt</div><div class="v">${esc(((c.salutation||'')+' '+(c.contactFirst||'')+' '+(c.contactLast||'')).trim()||'—')}</div>
        <div class="k">Branche / Ort</div><div class="v">${esc(c.industry||'—')} · ${esc(c.city||'—')}</div>
        <div class="k">Phase</div><div class="v">${esc(c.stage)}${c.dealValue?' · '+eur(c.dealValue):''}</div>
        <div class="k">Letzter Anruf</div><div class="v">${last?dtfmt(last.ts)+' – '+esc(last.note.slice(0,60)):'noch nie'}</div>
        ${c.notes?`<div class="k">Notizen</div><div class="v">${esc(c.notes.slice(0,140))}</div>`:''}
      </div>
      ${tel?`<div style="display:flex;gap:8px;margin-bottom:14px">
        <a class="btn gold" href="tel:${tel}" style="flex:2;text-align:center;font-size:17px;padding:13px">📞 ${esc(c.phone)}</a>
        <a class="btn" href="https://wa.me/${tel.replace(/^\+/,'').replace(/^0/,'49')}" target="_blank" rel="noopener" style="flex:1;text-align:center;padding:13px">💬 WA</a></div>`
        :'<div class="hint" style="margin-bottom:12px">Keine Nummer hinterlegt.</div>'}
      <textarea class="in" id="dl_note" rows="2" placeholder="Gesprächsnotiz…"></textarea>
      <div class="eyebrow" style="margin:14px 0 8px">Ergebnis wählen → springt automatisch zum nächsten</div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
        <button class="btn" onclick="Dialer.log('Erreicht')">✓ Erreicht</button>
        <button class="btn" onclick="Dialer.log('Nicht erreicht')">✕ Nicht erreicht</button>
        <button class="btn" onclick="Dialer.log('Mailbox')">📼 Mailbox</button>
        <button class="btn gold" onclick="Dialer.log('Termin vereinbart')">📅 Termin!</button>
        <button class="btn" onclick="Dialer.log('Später erneut')">⏰ Später erneut</button>
        <button class="btn danger" onclick="Dialer.log('Kein Interesse')">Kein Interesse</button>
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:12px">
        <a onclick="Modal.close();Customers.openDetail('${c.id}')" style="font-size:12px">Kundenkarte öffnen</a>
        <a onclick="Dialer.i++;Dialer.screen()" style="font-size:12px">Überspringen →</a>
      </div>
    </div>`,'wide');
    setTimeout(()=>$('#dl_note')?.focus(),50);
  },
  log(res){
    const c=this.q[this.i]; const note=(res+': '+($('#dl_note')?.value||'').trim()).replace(/: $/,'');
    const nid=uid();
    commit('Dialer-Anruf bei „'+c.company+'" – '+res,()=>{
      DB.calls.push({id:nid,customerId:c.id,dir:'Ausgehend',note,ts:new Date().toISOString(),by:Auth.user.name});
      if(res==='Kein Interesse')c.stage='Verloren';
      if(res==='Termin vereinbart'&&c.stage==='Neu')c.stage='Kontaktiert';
      if(res==='Erreicht'&&c.stage==='Neu')c.stage='Kontaktiert';
      if(res==='Später erneut'){const d=new Date();d.setDate(d.getDate()+3);c.followUp=d.toISOString().slice(0,10);}
      if(res==='Nicht erreicht'||res==='Mailbox'){const d=new Date();d.setDate(d.getDate()+1);c.followUp=d.toISOString().slice(0,10);}
    },'crm',c.id);
    this.stats.done++; if(res==='Erreicht'||res==='Termin vereinbart')this.stats.reached++; if(res==='Termin vereinbart')this.stats.appt++;
    if(res==='Termin vereinbart'){ Cal.openForm(null,c.id); const back=Modal.close; /* nach Terminform weiter */
      const oldSave=Cal.save.bind(Cal); Cal.save=(id)=>{oldSave(id);Cal.save=oldSave;Dialer.i++;Dialer.screen();}; return; }
    this.i++; this.screen();
  },
  finish(){
    const m=Math.max(1,Math.round((Date.now()-this.started)/6e4)), s=this.stats||{done:0,reached:0,appt:0};
    Modal.open(`<div class="mhead"><h2 class="display">Session beendet</h2><button class="iconbtn" onclick="Modal.close()">✕</button></div>
    <div class="mbody"><div class="kvs">
      <div class="k">Anrufe protokolliert</div><div class="v">${s.done} in ${m} Min</div>
      <div class="k">Erreicht</div><div class="v">${s.reached} (${s.done?Math.round(s.reached/s.done*100):0} %)</div>
      <div class="k">Termine</div><div class="v" style="color:var(--gold-bright)">${s.appt}</div>
    </div><div class="hint" style="margin-top:12px">Alle Ergebnisse sind protokolliert. Nicht Erreichte stehen morgen automatisch auf Wiedervorlage, „Später erneut" in 3 Tagen.</div></div>
    <div class="mfoot"><span></span><button class="btn gold" onclick="Modal.close();Router.go('dashboard')">Fertig</button></div>`);
    if(s.done)commit('Dialer-Session: '+s.done+' Anrufe, '+s.appt+' Termine',()=>{},'crm');
  }
};

/* ================================================================
   ERWEITERUNG v5: Insights-Engine · KI-Empfehlungen · Benachrichtigungen
   ================================================================ */
const Insights={
  W:{'Neu':10,'Kontaktiert':25,'Angebot':45,'Verhandlung':70}, /* heuristische Abschlusswahrscheinlichkeit je Phase */
  /* ---------- Regel-Engine: Nächste beste Aktionen, deterministisch, kostenlos ---------- */
  rules(){
    const out=[], t=today(), now=Date.now();
    const days=iso=>Math.floor((now-new Date(iso).getTime())/864e5);
    /* 1. Angebote kurz vor Ablauf */
    DB.quotes.filter(q=>q.status==='Versendet'&&q.valid>=t&&(new Date(q.valid)-now)<4*864e5).forEach(q=>{
      const c=DB.customers.find(x=>x.id===q.customerId);
      out.push({prio:92,badge:'Angebot läuft ab',what:`${q.number} (${eur(q.gross)}) bei ${c?.company||'?'} läuft in ${Math.max(0,Math.ceil((new Date(q.valid)-now)/864e5))} Tagen ab`,why:'Kurz vor Ablauf ist die Abschlusswahrscheinlichkeit am höchsten – jetzt nachfassen schlägt jede spätere Reaktivierung.',act:`Router.go('quotes','${q.id}')`,actLabel:'Angebot öffnen & nachfassen'});});
    /* 2. Heiße Deals ohne Kontakt seit >5 Tagen */
    DB.customers.filter(c=>['Angebot','Verhandlung'].includes(c.stage)).forEach(c=>{
      const lastCall=DB.calls.filter(x=>x.customerId===c.id).slice(-1)[0];
      const d=lastCall?days(lastCall.ts):(c.updated?days(c.updated):99);
      if(d>5)out.push({prio:80+Math.min(d,15),badge:'Heißer Deal kalt',what:`${c.company} (${c.stage}${c.dealValue?', '+eur(c.dealValue):''}) – ${d} Tage kein Kontakt`,why:`Phase „${c.stage}" ≈ ${this.W[c.stage]} % Abschlusschance (Einschätzung) – jeder Tag Funkstille senkt sie messbar.`,act:`Calls.log('${c.id}')`,actLabel:'Jetzt anrufen'});});
    /* 3. Überfällige Rechnungen */
    DB.invoices.filter(i=>i.status!=='Bezahlt'&&i.due<t).forEach(i=>{
      const c=DB.customers.find(x=>x.id===i.customerId);
      out.push({prio:88,badge:'Liquidität',what:`${i.number} (${eur(i.gross)}) bei ${c?.company||'?'} ist ${days(i.due+'T00:00')} Tage überfällig`,why:'Offene Forderungen kosten direkt Liquidität – Zahlungserinnerung liegt fertig im E-Mail-Center.',act:`Router.go('invoices','${i.id}')`,actLabel:'Rechnung öffnen'});});
    /* 4. Neue Leads unbearbeitet >3 Tage */
    const stale=DB.customers.filter(c=>c.stage==='Neu'&&days(c.created||new Date().toISOString())>3);
    if(stale.length)out.push({prio:70,badge:'Lead-Hygiene',what:`${stale.length} neue Leads seit >3 Tagen unangetastet`,why:'Kontaktquote fällt mit jedem Tag Wartezeit – eine Dialer-Session räumt das in einem Rutsch ab.',act:`Dialer.start()`,actLabel:'▶ Dialer-Session starten'});
    /* 5. Gewichtete Pipeline */
    const wsum=DB.customers.filter(c=>this.W[c.stage]&&c.dealValue).reduce((s,c)=>s+c.dealValue*this.W[c.stage]/100,0);
    if(wsum>0)out.push({prio:40,badge:'Forecast',what:`Gewichtete Pipeline: ${eur(wsum)} erwartbarer Umsatz`,why:'Deal-Werte × heuristische Phasen-Wahrscheinlichkeit ('+Object.entries(this.W).map(([k,v])=>k+' '+v+' %').join(' · ')+'). Einschätzung, keine Garantie.',act:`Router.go('pipeline')`,actLabel:'Pipeline öffnen'});
    /* 6. Follow-up-Disziplin */
    const noFU=DB.customers.filter(c=>!['Gewonnen','Verloren'].includes(c.stage)&&!c.followUp).length;
    if(noFU>2)out.push({prio:55,badge:'Prozess',what:`${noFU} aktive Kunden ohne Wiedervorlage-Datum`,why:'Ohne Wiedervorlage entscheidet der Zufall über Nachfassen. Zwei Klicks pro Kunde schließen die Lücke.',act:`Router.go('customers')`,actLabel:'Kundenliste öffnen'});
    return out.sort((a,b)=>b.prio-a.prio);
  },
  /* ---------- Badge-Zähler für die Glocke ---------- */
  count(){ return this.rules().filter(r=>r.prio>=70).length + (DB.insights?.items?.length||0); },
  bell(){ const b=$('#bellcnt'); if(!b)return; const n=this.count(); b.textContent=n; b.style.display=n?'flex':'none'; },
  panel(){
    const rules=this.rules(), ki=DB.insights?.items||[];
    Modal.open(`<div class="mhead"><div><div class="eyebrow">Empfehlungen</div><h2 class="display">Was den Betrieb jetzt nach vorn bringt</h2></div><button class="iconbtn" onclick="Modal.close()">✕</button></div>
    <div class="mbody">
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:14px">
        <button class="btn gold" id="ins_btn" onclick="Insights.ai()">🧠 KI-Analyse ${ki.length?'aktualisieren':'starten'}</button>
        ${DB.insights?.ts?`<span class="hint">Letzte Analyse: ${dtfmt(DB.insights.ts)}</span>`:'<span class="hint">Analysiert eure echten Zahlen – keine erfundenen Benchmarks.</span>'}
      </div>
      ${ki.length?`<div class="eyebrow" style="margin-bottom:8px">KI-Empfehlungen</div>`+ki.map(x=>this.card(x,true)).join(''):''}
      <div class="eyebrow" style="margin:14px 0 8px">Automatische Signale</div>
      ${rules.map(r=>this.card(r,false)).join('')||'<div class="hint">Alles im grünen Bereich – keine dringenden Signale.</div>'}
    </div>`,'xl');
  },
  card(x,isAi){
    const conf=x.conf!==undefined?`<div style="display:flex;align-items:center;gap:8px;margin-top:6px"><div style="flex:1;height:4px;background:var(--line);border-radius:2px"><div style="width:${x.conf}%;height:4px;background:var(--gold);border-radius:2px"></div></div><span style="font-size:11px;color:var(--gold)">${x.conf} % Zuversicht</span></div>`:'';
    return `<div class="card" style="padding:14px 16px;margin-bottom:9px">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="badge ${isAi?'b-gold':'b-grey'}">${isAi?'🧠 KI':esc(x.badge)}</span><b style="color:var(--ivory)">${esc(x.what||x.title)}</b></div>
      <div style="font-size:12.5px;color:var(--muted);margin-top:5px">${esc(x.why)}</div>${conf}
      ${x.act?`<button class="btn sm gold" style="margin-top:9px" onclick="Modal.close();${x.act}">${esc(x.actLabel||'Ausführen')}</button>`:(x.step?`<div style="font-size:12px;color:var(--gold-bright);margin-top:7px">→ ${esc(x.step)}</div>`:'')}
    </div>`;
  },
  /* ---------- KI-Analyse über den bestehenden Proxy ---------- */
  snapshot(){
    const t=today(), now=Date.now(), days=iso=>Math.floor((now-new Date(iso).getTime())/864e5);
    return {
      kunden_pro_phase:Object.fromEntries([...STAGES,'Gewonnen','Verloren'].map(s=>[s,DB.customers.filter(c=>c.stage===s).length])),
      pipeline_wert:DB.customers.filter(c=>!['Gewonnen','Verloren'].includes(c.stage)).reduce((s,c)=>s+(c.dealValue||0),0),
      angebote:{offen:DB.quotes.filter(q=>q.status==='Versendet').length,angenommen:DB.quotes.filter(q=>q.status==='Angenommen').length,abgelehnt:DB.quotes.filter(q=>q.status==='Abgelehnt').length,aeltestes_offen_tage:Math.max(0,...DB.quotes.filter(q=>q.status==='Versendet').map(q=>days(q.date)))},
      rechnungen:{offen_summe:DB.invoices.filter(i=>i.status!=='Bezahlt').reduce((s,i)=>s+i.gross,0),ueberfaellig:DB.invoices.filter(i=>i.status!=='Bezahlt'&&i.due<t).length,bezahlt_summe:DB.invoices.filter(i=>i.status==='Bezahlt').reduce((s,i)=>s+i.gross,0)},
      aktivitaet_14t:{anrufe:DB.calls.filter(x=>days(x.ts)<=14).length,termine:DB.appointments.filter(a=>days(a.start)<=14&&days(a.start)>=-14).length,neue_leads:DB.customers.filter(c=>c.created&&days(c.created)<=14).length},
      leads_ohne_wiedervorlage:DB.customers.filter(c=>!['Gewonnen','Verloren'].includes(c.stage)&&!c.followUp).length,
      offene_aufgaben:DB.tasks.filter(x=>!x.done).length,
      branche:INDUSTRY_PACKS[DB.industryPack||'none'].label
    };
  },
  async ai(){
    const btn=$('#ins_btn'); if(btn){btn.disabled=true;btn.textContent='Analysiere…';}
    try{
      if(!CLOUD.on()&&!DB.settingsAI.apiKey){toast('KI nicht konfiguriert – Einstellungen → KI','err');if(btn){btn.disabled=false;btn.textContent='🧠 KI-Analyse starten';}return;}
      const prompt='Du bist Vertriebs- und Betriebsberater für einen deutschen Handwerks-/Dienstleistungsbetrieb. Analysiere AUSSCHLIESSLICH diese echten Kennzahlen aus dem CRM:\n'+JSON.stringify(this.snapshot())+
        '\nGib die 3 bis 5 wirkungsvollsten konkreten Maßnahmen zurück, die den Betrieb jetzt nach vorn bringen. Regeln: Keine erfundenen Zahlen oder Branchen-Benchmarks. Zuversicht (conf, 10-95) ehrlich danach bemessen, wie stark die Datenlage die Empfehlung stützt. Antworte NUR mit JSON-Array, kein Markdown, keine Einleitung: [{"title":"...","why":"Begründung mit Bezug auf die Zahlen","step":"konkreter erster Schritt","conf":NUMBER}]';
      const payload={model:'claude-sonnet-4-6',max_tokens:850,messages:[{role:'user',content:prompt}]};
      let res;
      if(CLOUD.on()){ const {data:{session}}=await CLOUD.sb.auth.getSession();
        res=await fetch(CLOUD.url+'/functions/v1/ai-proxy',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify(payload)});
      }else{
        res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':DB.settingsAI.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(payload)});
      }
      const data=await res.json();
      if(data.error)throw new Error(data.error.message||'API-Fehler');
      const txt=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
      const items=JSON.parse(txt.replace(/```json|```/g,'').trim()).slice(0,5)
        .map(x=>({title:String(x.title||'').slice(0,120),why:String(x.why||'').slice(0,400),step:String(x.step||'').slice(0,200),conf:Math.max(10,Math.min(95,Math.round(+x.conf||50)))}));
      commit('KI-Analyse: '+items.length+' Empfehlungen erzeugt',()=>{DB.insights={ts:new Date().toISOString(),items}},'ai');
      this.panel(); this.bell();
    }catch(e){ toast('KI-Analyse fehlgeschlagen: '+e.message,'err'); if(btn){btn.disabled=false;btn.textContent='🧠 KI-Analyse starten';} }
  }
};
window.Insights=Insights;

function migrateV6(){
  DB.timeclock=DB.timeclock||[];   /* {id,userId,userName,inTs,outTs,note,breakMin} */
  if(DB.features.timeclock===undefined)DB.features.timeclock=true;
  if(DB.features.reports===undefined)DB.features.reports=true;
  if(DB.templates&&!DB.templates.find(t=>t.id==='t_invoice'))DB.templates.push({id:'t_invoice',cat:'Vertrieb',name:'Rechnungsversand',subject:'Ihre Rechnung {{rechnung_nr}} von {{firma_eigen}}',body:'Sehr geehrte(r) {{anrede}} {{nachname}},\n\nvielen Dank für Ihren Auftrag. Anbei erhalten Sie Ihre Rechnung {{rechnung_nr}} über {{rechnung_summe}}.\n\nBitte überweisen Sie den Betrag bis zum {{rechnung_faellig}} auf das angegebene Konto.\n\nMit besten Grüßen\n{{user}}\n{{firma_eigen}}'});
  if(DB.company.mapsKey===undefined)DB.company.mapsKey='';
  if(!Array.isArray(DB.expenses))DB.expenses=[];
  if(!DB.accounting)DB.accounting={taxMode:'ist',reservePct:30};
  if(DB.features.accounting===undefined)DB.features.accounting=true;
  if(!Array.isArray(DB.stages)||!DB.stages.length)DB.stages=['Neu','Kontaktiert','Angebot','Verhandlung','Gewonnen'];
  STAGES=DB.stages;
  if(!DB.company.lang)DB.company.lang='de'; LANG=DB.company.lang;
  if(!DB.company.currency)DB.company.currency='EUR';
}

/* ---------- Zeiterfassung / Stempeluhr ---------- */
const Clock={
  openOf(uid){ return DB.timeclock.find(t=>t.userId===uid&&!t.outTs); },
  render(root){
    const isAdmin=Auth.isAdmin();
    const open=this.openOf(Auth.user.id);
    const mine=DB.timeclock.filter(t=>t.userId===Auth.user.id);
    root.innerHTML=`<div class="vhead"><div><div class="eyebrow">System</div><h1 class="display">Zeiterfassung</h1><div class="hint">Ein Klick stempelt ein und aus. Export als Excel-CSV jederzeit.</div></div>
      <button class="btn ${open?'danger':'gold'}" style="font-size:16px;padding:13px 26px" onclick="Clock.punch()">${open?'⏹ Ausstempeln':'▶ Einstempeln'}</button></div>
      ${open?`<div class="card" style="border-color:var(--gold);margin-bottom:16px"><div style="display:flex;justify-content:space-between;align-items:center">
        <div><div class="eyebrow" style="color:var(--gold)">Läuft seit ${dtfmt(open.inTs)}</div><div id="clock_live" style="font-family:var(--f-cond);font-size:32px;color:var(--gold-bright);margin-top:6px">–</div></div>
        <div style="text-align:right"><input class="in" id="clock_note" placeholder="Notiz (optional)" value="${esc(open.note||'')}" style="width:220px" onchange="Clock.setNote('${open.id}',this.value)"></div></div></div>`:''}
      <div class="grid g4" style="margin-bottom:16px">
        <div class="card kpi"><div class="lab">Heute</div><div class="val gold">${this.fmtH(this.sum(Auth.user.id,'today'))}</div></div>
        <div class="card kpi"><div class="lab">Diese Woche</div><div class="val">${this.fmtH(this.sum(Auth.user.id,'week'))}</div></div>
        <div class="card kpi"><div class="lab">Dieser Monat</div><div class="val">${this.fmtH(this.sum(Auth.user.id,'month'))}</div></div>
        <div class="card kpi"><div class="lab">Einträge</div><div class="val">${mine.length}</div></div>
      </div>
      <div class="tblwrap"><div class="tbar">
        <div class="eyebrow">${isAdmin?'Alle Zeiten (Admin)':'Meine Zeiten'}</div>
        ${isAdmin?`<select class="in" id="tc_user" style="max-width:180px;margin-left:auto" onchange="Clock.render(document.querySelector('#viewroot'))"><option value="">Alle Mitarbeiter</option>${DB.users.map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select>`:'<span style="margin-left:auto"></span>'}
        <button class="btn sm" onclick="Clock.export()">⇩ Excel-Export</button>
        <button class="btn sm" onclick="Clock.addManual()">+ Manuell</button>
      </div>
      <table><thead><tr><th>Mitarbeiter</th><th>Datum</th><th>Von</th><th>Bis</th><th>Pause</th><th style="text-align:right">Dauer</th><th>Notiz</th><th></th></tr></thead><tbody>
      ${this.rows(isAdmin)}</tbody></table></div>`;
    if(open)this._tick(open);
  },
  rows(isAdmin){
    const uf=$('#tc_user')?.value||'';
    let list=isAdmin?DB.timeclock:DB.timeclock.filter(t=>t.userId===Auth.user.id);
    if(uf)list=list.filter(t=>t.userId===uf);
    list=[...list].sort((a,b)=>(b.inTs||'').localeCompare(a.inTs||''));
    return list.slice(0,200).map(t=>{const dur=this.dur(t);
      return `<tr style="cursor:default"><td>${esc(t.userName)}</td><td>${dfmt(t.inTs)}</td><td class="mono">${t.inTs?t.inTs.slice(11,16):'—'}</td>
        <td class="mono">${t.outTs?t.outTs.slice(11,16):'<span class="badge b-gold" style="font-size:9px;padding:2px 6px">läuft</span>'}</td>
        <td class="mono">${t.breakMin||0} min</td><td style="text-align:right" class="mono">${t.outTs?this.fmtH(dur):'—'}</td>
        <td style="font-size:12px;color:var(--muted)">${esc(t.note||'')}</td>
        <td style="text-align:right">${(isAdmin||t.userId===Auth.user.id)?`<button class="iconbtn" onclick="Clock.edit('${t.id}')">✎</button><button class="iconbtn" onclick="Clock.remove('${t.id}')">✕</button>`:''}</td></tr>`;
    }).join('')||'<tr><td colspan="8"><div class="empty">Noch keine Zeiten erfasst.</div></td></tr>';
  },
  punch(){
    const open=this.openOf(Auth.user.id);
    if(open){ commit('Ausgestempelt ('+this.fmtH(this.dur({...open,outTs:new Date().toISOString()}))+')',()=>{open.outTs=new Date().toISOString()},'timeclock'); toast('Ausgestempelt'); }
    else{ const id=uid(); commit('Eingestempelt',()=>DB.timeclock.push({id,userId:Auth.user.id,userName:Auth.user.name,inTs:new Date().toISOString(),outTs:null,note:'',breakMin:0}),'timeclock'); toast('Eingestempelt – guten Dienst!'); }
    Clock.render($('#viewroot'));
  },
  setNote(id,v){ const t=DB.timeclock.find(x=>x.id===id); if(t){t.note=v;Store.save();} },
  _tick(open){ clearInterval(this._iv); const el=()=>$('#clock_live'); const upd=()=>{ if(!el()){clearInterval(this._iv);return;} const ms=Date.now()-new Date(open.inTs).getTime(); const h=Math.floor(ms/36e5),m=Math.floor(ms/6e4)%60,s=Math.floor(ms/1e3)%60; el().textContent=`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; }; upd(); this._iv=setInterval(upd,1000); },
  dur(t){ if(!t.inTs||!t.outTs)return 0; return Math.max(0,(new Date(t.outTs)-new Date(t.inTs))/6e4-(t.breakMin||0)); },
  sum(uid,range){ const now=new Date(); return DB.timeclock.filter(t=>t.userId===uid&&t.outTs).filter(t=>{const d=new Date(t.inTs);
    if(range==='today')return d.toDateString()===now.toDateString();
    if(range==='week'){const ws=new Date(now);ws.setDate(now.getDate()-((now.getDay()+6)%7));ws.setHours(0,0,0,0);return d>=ws;}
    if(range==='month')return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();
    return true;}).reduce((s,t)=>s+this.dur(t),0); },
  fmtH(min){ const h=Math.floor(min/60),m=Math.round(min%60); return h+':'+String(m).padStart(2,'0')+' h'; },
  edit(id){ const t=DB.timeclock.find(x=>x.id===id);
    Modal.open(`<div class="mhead"><h2 class="display">Zeit bearbeiten</h2><button class="iconbtn" onclick="Modal.close()">✕</button></div>
    <div class="mbody"><div class="grid2">
      <label class="fl">Von<input class="in" id="ed_in" type="datetime-local" value="${t.inTs?t.inTs.slice(0,16):''}"></label>
      <label class="fl">Bis<input class="in" id="ed_out" type="datetime-local" value="${t.outTs?t.outTs.slice(0,16):''}"></label>
      <label class="fl">Pause (Min)<input class="in" id="ed_break" type="number" value="${t.breakMin||0}"></label>
      <label class="fl">Notiz<input class="in" id="ed_note" value="${esc(t.note||'')}"></label>
    </div></div><div class="mfoot"><button class="btn" onclick="Modal.close()">Abbrechen</button><button class="btn gold" onclick="Clock.saveEdit('${id}')">Speichern</button></div>`);
  },
  saveEdit(id){ const t=DB.timeclock.find(x=>x.id===id);
    commit('Zeiteintrag bearbeitet',()=>{t.inTs=$('#ed_in').value?new Date($('#ed_in').value).toISOString():t.inTs;t.outTs=$('#ed_out').value?new Date($('#ed_out').value).toISOString():null;t.breakMin=+$('#ed_break').value||0;t.note=$('#ed_note').value;},'timeclock');
    Modal.close(); Clock.render($('#viewroot')); },
  addManual(){ const id=uid(); const now=new Date(); const iso=now.toISOString().slice(0,16);
    Modal.open(`<div class="mhead"><h2 class="display">Zeit manuell erfassen</h2><button class="iconbtn" onclick="Modal.close()">✕</button></div>
    <div class="mbody"><div class="grid2">
      <label class="fl">Von<input class="in" id="ed_in" type="datetime-local" value="${iso}"></label>
      <label class="fl">Bis<input class="in" id="ed_out" type="datetime-local" value="${iso}"></label>
      <label class="fl">Pause (Min)<input class="in" id="ed_break" type="number" value="0"></label>
      <label class="fl">Notiz<input class="in" id="ed_note" placeholder="z. B. Baustelle Müller"></label>
    </div></div><div class="mfoot"><button class="btn" onclick="Modal.close()">Abbrechen</button><button class="btn gold" onclick="Clock.saveManual('${id}')">Speichern</button></div>`);
  },
  saveManual(id){ commit('Zeit manuell erfasst',()=>DB.timeclock.push({id,userId:Auth.user.id,userName:Auth.user.name,inTs:new Date($('#ed_in').value).toISOString(),outTs:$('#ed_out').value?new Date($('#ed_out').value).toISOString():null,breakMin:+$('#ed_break').value||0,note:$('#ed_note').value}),'timeclock'); Modal.close(); Clock.render($('#viewroot')); },
  remove(id){ if(!confirm('Zeiteintrag löschen?'))return; commit('Zeiteintrag gelöscht',()=>{DB.timeclock=DB.timeclock.filter(x=>x.id!==id)},'timeclock'); Clock.render($('#viewroot')); },
  export(){ const q=v=>{v=String(v??'');return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
    let csv='\uFEFFMitarbeiter;Datum;Von;Bis;Pause (Min);Dauer (Std);Notiz\n';
    [...DB.timeclock].sort((a,b)=>(a.inTs||'').localeCompare(b.inTs||'')).forEach(t=>{
      csv+=[q(t.userName),dfmt(t.inTs),t.inTs?t.inTs.slice(11,16):'',t.outTs?t.outTs.slice(11,16):'',t.breakMin||0,q((this.dur(t)/60).toFixed(2).replace('.',',')),q(t.note)].join(';')+'\n';});
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download='zeiterfassung-'+today()+'.csv'; a.click();
    commit('Zeiterfassung exportiert',()=>{},'timeclock'); }
};

/* ---------- Auswertung: Was wurde wem berechnet & warum ---------- */
const Reports={
  render(root){
    if(!Auth.isAdmin()){ root.innerHTML='<div class="vhead"><div><h1 class="display">Auswertung</h1></div></div><div class="empty"><div class="big">Nur für Admins</div>Umsatz- und Abrechnungsauswertungen sind Admins vorbehalten.</div>'; return; }
    const inv=DB.invoices;
    const byStatus=s=>inv.filter(i=>i.status===s);
    const revPaid=byStatus('Bezahlt').reduce((s,i)=>s+i.gross,0);
    const revOpen=inv.filter(i=>i.status!=='Bezahlt'&&i.status!=='Storniert').reduce((s,i)=>s+i.gross,0);
    /* pro Betreuer: was wurde über dessen Kunden fakturiert */
    const owner=cid=>DB.users.find(u=>u.id===DB.customers.find(c=>c.id===cid)?.ownerId);
    const perUser={};
    inv.forEach(i=>{const o=owner(i.customerId); const key=o?o.name:'—';
      perUser[key]=perUser[key]||{name:key,invoiced:0,paid:0,open:0,count:0,quotes:0,won:0};
      perUser[key].invoiced+=i.gross; perUser[key].count++;
      if(i.status==='Bezahlt')perUser[key].paid+=i.gross; else if(i.status!=='Storniert')perUser[key].open+=i.gross;});
    DB.quotes.forEach(q=>{const o=owner(q.customerId); const key=o?o.name:'—'; perUser[key]=perUser[key]||{name:key,invoiced:0,paid:0,open:0,count:0,quotes:0,won:0}; perUser[key].quotes++; if(q.status==='Angenommen')perUser[key].won++;});
    const rows=Object.values(perUser).sort((a,b)=>b.invoiced-a.invoiced);
    /* Umsatz je Monat */
    const byMonth={}; DB.invoices.filter(i=>i.status==='Bezahlt').forEach(i=>{const m=(i.date||'').slice(0,7); byMonth[m]=(byMonth[m]||0)+i.gross;});
    const months=Object.keys(byMonth).sort().slice(-6);
    /* Was/warum berechnet: Positions-Aggregation */
    const posAgg={}; DB.invoices.forEach(i=>i.items.forEach(p=>{const k=p.desc.replace(/\s*\(.*?\)\s*/g,'').trim()||'—'; posAgg[k]=posAgg[k]||{desc:k,menge:0,umsatz:0,n:0}; posAgg[k].menge+=(+p.qty||0); posAgg[k].umsatz+=(+p.qty||0)*(+p.price||0)*(1-(+p.discount||0)/100); posAgg[k].n++;}));
    const topPos=Object.values(posAgg).sort((a,b)=>b.umsatz-a.umsatz).slice(0,12);
    root.innerHTML=`<div class="vhead"><div><div class="eyebrow">System</div><h1 class="display">Auswertung</h1><div class="hint">Wer hat was fakturiert – und womit. Alle Zahlen aus euren echten Rechnungen & Angeboten.</div></div>
      <button class="btn sm" onclick="Reports.export()">⇩ Export</button></div>
      <div class="grid g4" style="margin-bottom:18px">
        <div class="card kpi"><div class="lab">Bezahlter Umsatz</div><div class="val gold">${eur(revPaid)}</div><div class="sub">${byStatus('Bezahlt').length} Rechnungen</div></div>
        <div class="card kpi"><div class="lab">Offen</div><div class="val">${eur(revOpen)}</div><div class="sub">${inv.filter(i=>i.status!=='Bezahlt'&&i.status!=='Storniert').length} Rechnungen</div></div>
        <div class="card kpi"><div class="lab">Ø Rechnungswert</div><div class="val">${eur(inv.length?inv.reduce((s,i)=>s+i.gross,0)/inv.length:0)}</div></div>
        <div class="card kpi"><div class="lab">Angebots-Quote</div><div class="val">${(()=>{const sent=DB.quotes.filter(q=>q.status!=='Entwurf').length,won=DB.quotes.filter(q=>q.status==='Angenommen').length;return sent?Math.round(won/sent*100)+' %':'—';})()}</div><div class="sub">angenommen / versendet</div></div>
      </div>
      ${months.length?`<div class="card" style="margin-bottom:16px"><div class="eyebrow" style="margin-bottom:14px">Umsatz je Monat (bezahlt)</div>
        <div style="display:flex;gap:10px;align-items:flex-end;height:150px">${months.map(m=>{const v=byMonth[m],max=Math.max(...months.map(x=>byMonth[x]));return `<div style="flex:1;text-align:center"><div style="background:linear-gradient(180deg,var(--gold),var(--gold-dim));height:${Math.round(v/max*120)}px;border-radius:6px 6px 0 0"></div><div style="font-size:11px;color:var(--faint);margin-top:6px">${m.slice(5)}/${m.slice(2,4)}</div><div style="font-size:11px;color:var(--gold-bright)">${eur(v)}</div></div>`;}).join('')}</div></div>`:''}
      <div class="grid g2">
      <div class="card"><div class="eyebrow" style="margin-bottom:12px">Abrechnung je Betreuer</div>
        <table><thead><tr><th>Betreuer</th><th style="text-align:right">Fakturiert</th><th style="text-align:right">Bezahlt</th><th style="text-align:right">Offen</th><th style="text-align:right">Angeb.</th></tr></thead><tbody>
        ${rows.map(r=>`<tr style="cursor:default"><td style="color:var(--ivory)">${esc(r.name)}</td><td style="text-align:right" class="mono">${eur(r.invoiced)}</td><td style="text-align:right" class="mono" style="color:var(--success)">${eur(r.paid)}</td><td style="text-align:right" class="mono">${eur(r.open)}</td><td style="text-align:right" class="mono">${r.won}/${r.quotes}</td></tr>`).join('')||'<tr><td colspan="5"><div class="empty">Noch keine Daten.</div></td></tr>'}</tbody></table></div>
      <div class="card"><div class="eyebrow" style="margin-bottom:12px">Womit Umsatz gemacht wird (Top-Positionen)</div>

    DB.invoices.forEach(i=>{const c=DB.customers.find(x=>x.id===i.customerId); csv+=[q(i.number),q(c?.company),q(owner(i.customerId)),dfmt(i.date),q(i.status),q((i.net).toFixed(2).replace('.',',')),q((i.gross).toFixed(2).replace('.',','))].join(';')+'\n';});
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download='auswertung-'+today()+'.csv'; a.click(); }

      <label class="fl" style="grid-column:1/-1">Bezeichnung<input class="in" id="ca_name" value="${esc(c?.name||'')}"></label>
      <label class="fl">Preis netto (€)<input class="in" id="ca_price" type="number" step="0.01" value="${c?.price||''}"></label>
    </div></div><div class="mfoot"><button class="btn" onclick="Modal.close()">Abbrechen</button><button class="btn gold" onclick="CatalogAdmin.save('${c?.id||''}')">Speichern</button></div>`);
  },
  add(){ this.edit(''); },
  save(id){ const name=$('#ca_name').value.trim(); if(!name){toast('Bezeichnung fehlt','err');return}
    const data={trade:$('#ca_trade').value.trim()||'Allgemein',name,unit:$('#ca_unit').value.trim()||'Pauschal',price:+$('#ca_price').value||0};
    if(id)commit('Katalog-Position bearbeitet: '+name,()=>Object.assign(DB.catalog.find(x=>x.id===id),data),'settings');
    else commit('Katalog-Position angelegt: '+name,()=>DB.catalog.push(Object.assign({id:uid()},data)),'settings');
    Modal.close(); CatalogAdmin.render($('#viewroot')); toast('Gespeichert'); },
  remove(id){ const c=DB.catalog.find(x=>x.id===id); if(!confirm('Position „'+c.name+'“ löschen?'))return;
    commit('Katalog-Position gelöscht: '+c.name,()=>{DB.catalog=DB.catalog.filter(x=>x.id!==id)},'settings'); CatalogAdmin.render($('#viewroot')); },
  export(){ const q=v=>{v=String(v??'');return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
    let csv='\uFEFFGewerk;Bezeichnung;Einheit;Preis netto\n';
    DB.catalog.forEach(c=>{csv+=[q(c.trade),q(c.name),q(c.unit),q(String(c.price).replace('.',','))].join(';')+'\n';});
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download='katalog-'+today()+'.csv'; a.click(); },
  import(file){ if(!file)return; const rd=new FileReader(); rd.onload=()=>{ let txt=rd.result.replace(/^\uFEFF/,'');
    const delim=(txt.split('\n')[0].match(/;/g)||[]).length>=(txt.split('\n')[0].match(/,/g)||[]).length?';':',';
    const lines=txt.split(/\r?\n/).filter(l=>l.trim()); const items=[];
    lines.slice(1).forEach(l=>{const p=l.split(delim).map(x=>x.replace(/^"|"$/g,'').trim()); if(p[1])items.push({id:uid(),trade:p[0]||'Allgemein',name:p[1],unit:p[2]||'Pauschal',price:+(p[3]||'0').replace(',','.')||0});});

    rd.readAsText(file,'utf-8'); }
};
